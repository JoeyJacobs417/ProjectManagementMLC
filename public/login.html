<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Inloggen — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head><body>
<main class="container">
  <div class="auth-card">
    <div class="brand-large">
      <span class="brand-mark"></span>
      <h1>Projectmanager</h1>
    </div>
    <form id="loginForm" class="form">
      <label>E-mail<input type="email" name="email" required autofocus></label>
      <label>Wachtwoord<input type="password" name="password" required></label>
      <button class="btn btn-primary" type="submit">Inloggen</button>
    </form>
  </div>
</main>
<script type="module">
  import { apiSend, toast } from '/app.js';
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await apiSend('/api/auth/login', 'POST', {
        email: f.get('email'), password: f.get('password'),
      });
      location.href = '/dashboard.html';
    } catch (err) {
      toast(err.message, 'error');
    }
  });
</script>
</body></html>
