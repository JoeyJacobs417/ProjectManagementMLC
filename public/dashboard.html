<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Dashboard — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <h1>Dashboard</h1>
  <p class="subtle">Overzicht: deadlines, modulerapport, omzetvoorspelling en medewerkers.</p>

  <h2>Komende deadlines</h2>
  <div id="deadlines"><p class="subtle">Laden…</p></div>

  <h2 style="margin-top:2rem">Voorspelling omzet</h2>
  <div class="card-static" style="margin-bottom:1rem; padding:.75rem 1rem">
    <label style="display:flex; flex-direction:row; align-items:center; gap:.75rem; margin:0; font-weight:500">
      Voorspellingsperiode:
      <select id="forecastPeriod" style="width:auto">
        <option value="4">4 weken</option>
        <option value="8" selected>8 weken</option>
        <option value="12">12 weken</option>
        <option value="26">26 weken</option>
        <option value="52">52 weken</option>
      </select>
      <span class="subtle" id="forecastTotal"></span>
    </label>
  </div>
  <div id="forecast"><p class="subtle">Laden…</p></div>

  <h2 style="margin-top:2rem">Modulerapport</h2>
  <div id="moduleReport"><p class="subtle">Laden…</p></div>

  <h2 style="margin-top:2.5rem">Medewerkers</h2>
  <p class="subtle">Prestaties per medewerker over alle projecten waar ze aan zijn toegewezen.</p>
  <div id="employees"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, renderTopbar, escapeHtml, percentageBadgeClass, statusLabel, deadlineBadge, daysFromNow, fmtDate } from '/app.js';
  await renderTopbar('/dashboard.html');
  const [{ projects }, { settings }] = await Promise.all([
    apiGet('/api/projects'),
    apiGet('/api/admin/settings').catch(() => ({ settings: { clients: [], employee_capacities: {} } })),
  ]);
  const clientsById = Object.fromEntries((settings.clients || []).map((c) => [c.id, c]));
  const capacities = settings.employee_capacities || {};

  // ── Komende deadlines ─────────────────────────────────────────
  const deadlinesEl = document.getElementById('deadlines');
  const withDeadline = projects
    .filter((p) => p.deadline && p.status !== 'done')
    .map((p) => ({ p, days: daysFromNow(p.deadline) }))
    .filter((x) => x.days !== null)
    .sort((a, b) => a.days - b.days)
    .slice(0, 10);
  if (withDeadline.length === 0) {
    deadlinesEl.innerHTML = '<p class="subtle">Geen openstaande deadlines.</p>';
  } else {
    deadlinesEl.innerHTML = `
      <table class="table" style="margin:0">
        <thead><tr><th>Project</th><th>Klant</th><th>Deadline</th><th>Status</th><th>Uren</th></tr></thead>
        <tbody>
          ${withDeadline.map(({ p }) => `
            <tr class="clickable" data-id="${encodeURIComponent(p.id)}">
              <td><strong>${escapeHtml(p.name)}</strong>${p.is_poc ? ' <span class="badge" style="background:rgba(139,92,246,.15);color:#6d28d9">POC</span>' : ''}</td>
              <td>${escapeHtml(clientsById[p.client_id]?.name || '—')}</td>
              <td>${deadlineBadge(p.deadline)}</td>
              <td><span class="badge status-${p.status}">${statusLabel(p.status)}</span></td>
              <td>${p.hours_used.toFixed(1)} / ${(p.available_hours || 0).toFixed(1)} u</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
    deadlinesEl.querySelectorAll('tr.clickable').forEach((tr) => {
      tr.onclick = () => location.href = `/project.html?id=${tr.dataset.id}`;
    });
  }

  // ── Omzetvoorspelling ─────────────────────────────────────────
  function renderForecast() {
    const weeks = Number(document.getElementById('forecastPeriod').value) || 8;
    const inProgress = projects.filter((p) => p.status === 'in_progress' || p.status === 'future');

    // Per medewerker: aggregeer verwachte omzet
    const perPerson = new Map();
    // Verzamel ook per project totaal verwachte omzet
    let grandTotal = 0;
    for (const p of inProgress) {
      const remaining = Math.max(0, (Number(p.available_hours) || 0) - (Number(p.hours_used) || 0));
      const rate = Number(p.hourly_rate) || 0;
      if (remaining <= 0 || rate <= 0 || !p.team || p.team.length === 0) continue;

      const totalProjectHoursUsed = (p.team_stats || []).reduce((a, s) => a + (Number(s.hours) || 0), 0);
      for (const member of p.team) {
        const stat = (p.team_stats || []).find((s) => s.moneybird_user_id === member.moneybird_user_id);
        const memberHours = stat ? Number(stat.hours) || 0 : 0;
        // Verdeling: pro rata op basis van gewerkte uren; anders gelijk over team
        const shareRatio = totalProjectHoursUsed > 0
          ? (memberHours / totalProjectHoursUsed)
          : (1 / p.team.length);
        const estRemainingHours = shareRatio * remaining;

        if (!perPerson.has(member.moneybird_user_id)) {
          perPerson.set(member.moneybird_user_id, {
            id: member.moneybird_user_id,
            name: member.name,
            projectBreakdown: [],
            rawHours: 0,
          });
        }
        const rec = perPerson.get(member.moneybird_user_id);
        rec.projectBreakdown.push({ project: p, hours: estRemainingHours, rate });
        rec.rawHours += estRemainingHours;
      }
    }

    // Cap per persoon op (capacity * weeks)
    const rows = [];
    for (const rec of perPerson.values()) {
      const cap = Number(capacities[rec.id]) || 0;
      const maxHoursInPeriod = cap > 0 ? cap * weeks : Infinity;
      const factor = rec.rawHours > maxHoursInPeriod ? maxHoursInPeriod / rec.rawHours : 1;
      let cappedHours = 0;
      let cappedRevenue = 0;
      for (const b of rec.projectBreakdown) {
        const h = b.hours * factor;
        cappedHours += h;
        cappedRevenue += h * b.rate;
      }
      grandTotal += cappedRevenue;
      rows.push({
        name: rec.name,
        cap: cap > 0 ? cap : null,
        rawHours: rec.rawHours,
        cappedHours,
        cappedRevenue,
        capped: factor < 1,
      });
    }
    rows.sort((a, b) => b.cappedRevenue - a.cappedRevenue);

    const totalEl = document.getElementById('forecastTotal');
    totalEl.innerHTML = ` · Totaal verwachte omzet komende ${weeks} weken: <strong style="color:var(--text)">€ ${grandTotal.toFixed(2)}</strong>`;

    const el = document.getElementById('forecast');
    if (rows.length === 0) {
      el.innerHTML = '<p class="subtle">Geen actieve projecten met team om voorspelling op te baseren.</p>';
      return;
    }
    el.innerHTML = `
      <table class="table" style="margin:0">
        <thead><tr>
          <th>Medewerker</th>
          <th>Capaciteit</th>
          <th>Geschatte uren komende ${weeks}w</th>
          <th>Verwachte omzet</th>
        </tr></thead>
        <tbody>
          ${rows.map((r) => `
            <tr>
              <td><strong>${escapeHtml(r.name)}</strong></td>
              <td>${r.cap !== null ? r.cap + ' u/wk' : '<span class="subtle">niet ingesteld</span>'}</td>
              <td>${r.cappedHours.toFixed(1)} u${r.capped ? ' <span class="subtle">(capped op capaciteit)</span>' : ''}</td>
              <td><strong>€ ${r.cappedRevenue.toFixed(2)}</strong></td>
            </tr>`).join('')}
        </tbody>
      </table>
      <p class="subtle" style="margin-top:.5rem">
        Schatting is gebaseerd op resterende uren van projecten met status "In progress" of "Future", verdeeld over teamleden naar evenredigheid van gewerkte uren (of gelijk verdeeld als er nog niet gewerkt is), en gecapt op (capaciteit × ${weeks} weken).
      </p>
    `;
  }
  document.getElementById('forecastPeriod').addEventListener('change', renderForecast);
  renderForecast();

  // ── Modulerapport ─────────────────────────────────────────────
  const moduleEl = document.getElementById('moduleReport');
  const byModule = new Map();
  for (const p of projects) {
    const mod = p.module || '(geen module)';
    if (!byModule.has(mod)) byModule.set(mod, []);
    byModule.get(mod).push(p);
  }
  const moduleRows = Array.from(byModule.entries()).map(([mod, projs]) => {
    const totalAvail = projs.reduce((a, p) => a + (Number(p.available_hours) || 0), 0);
    const totalUsed = projs.reduce((a, p) => a + (Number(p.hours_used) || 0), 0);
    const avgPct = totalAvail > 0 ? Math.round((totalUsed / totalAvail) * 1000) / 10 : 0;
    const avgHoursPerProject = projs.length > 0 ? totalUsed / projs.length : 0;
    const statusCounts = projs.reduce((acc, p) => {
      acc[p.status || 'in_progress'] = (acc[p.status || 'in_progress'] || 0) + 1;
      return acc;
    }, {});
    return { mod, projs, totalAvail, totalUsed, avgPct, avgHoursPerProject, statusCounts };
  }).sort((a, b) => b.projs.length - a.projs.length);

  if (moduleRows.length === 0) {
    moduleEl.innerHTML = '<p class="subtle">Geen projecten om te rapporteren.</p>';
  } else {
    moduleEl.innerHTML = moduleRows.map((m) => {
      const statusBadges = Object.entries(m.statusCounts).map(([s, c]) =>
        `<span class="badge status-${s}">${statusLabel(s)}: ${c}</span>`).join(' ');
      return `
        <div class="card-static" style="margin-bottom:.75rem">
          <div class="card-header">
            <div>
              <h3 style="margin:0">${escapeHtml(m.mod)}</h3>
              <p class="subtle" style="margin:.25rem 0">${m.projs.length} ${m.projs.length === 1 ? 'project' : 'projecten'} · ${statusBadges}</p>
            </div>
            <div class="subtle" style="text-align:right">
              <div><strong>${m.totalUsed.toFixed(1)}</strong> / ${m.totalAvail.toFixed(1)} uur totaal</div>
              <div>Gemiddeld <strong>${m.avgHoursPerProject.toFixed(1)} uur/project</strong></div>
              ${m.totalAvail > 0 ? `<div><span class="badge ${percentageBadgeClass(m.avgPct)}">${m.avgPct}% verbruikt</span></div>` : ''}
            </div>
          </div>
          <details style="margin-top:.5rem">
            <summary class="subtle" style="cursor:pointer">Projecten in deze module</summary>
            <table class="table" style="margin:.5rem 0 0">
              <thead><tr><th>Project</th><th>Status</th><th>Uren</th><th>%</th></tr></thead>
              <tbody>
                ${m.projs.map((p) => `
                  <tr class="clickable" data-id="${encodeURIComponent(p.id)}">
                    <td><strong>${escapeHtml(p.name)}</strong></td>
                    <td><span class="badge status-${p.status}">${statusLabel(p.status)}</span></td>
                    <td>${p.hours_used.toFixed(1)} / ${(p.available_hours || 0).toFixed(1)} u</td>
                    <td><span class="badge ${percentageBadgeClass(p.percentage_used)}">${p.percentage_used}%</span></td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </details>
        </div>`;
    }).join('');
    moduleEl.querySelectorAll('tr.clickable').forEach((tr) => {
      tr.onclick = () => location.href = `/project.html?id=${tr.dataset.id}`;
    });
  }

  // ── Medewerkers ───────────────────────────────────────────────
  const empMap = new Map();
  for (const p of projects) {
    for (const t of (p.team || [])) {
      const key = t.moneybird_user_id;
      if (!empMap.has(key)) {
        empMap.set(key, { id: key, name: t.name, projects: [], totalHours: 0, withinBudget: 0, hasBudget: 0 });
      }
      const rec = empMap.get(key);
      rec.projects.push(p);
      const stat = (p.team_stats || []).find((s) => s.moneybird_user_id === key);
      rec.totalHours += stat ? Number(stat.hours) || 0 : 0;
      if (p.within_budget !== null) {
        rec.hasBudget += 1;
        if (p.within_budget) rec.withinBudget += 1;
      }
    }
  }
  const employees = Array.from(empMap.values()).sort((a, b) => b.totalHours - a.totalHours);

  const empEl = document.getElementById('employees');
  if (employees.length === 0) {
    empEl.innerHTML = '<p class="subtle">Nog geen medewerkers toegewezen aan projecten.</p>';
  } else {
    empEl.innerHTML = `
      <table class="table">
        <thead><tr><th>Medewerker</th><th>Projecten</th><th>Totaal uren</th><th>Binnen budget</th></tr></thead>
        <tbody>
          ${employees.map((e) => {
            const pctOk = e.hasBudget ? Math.round((e.withinBudget / e.hasBudget) * 100) : null;
            const badge = pctOk === null ? '—' :
              `<span class="badge ${pctOk >= 80 ? 'badge-green' : pctOk >= 50 ? 'badge-orange' : 'badge-red'}">${e.withinBudget}/${e.hasBudget} (${pctOk}%)</span>`;
            return `
              <tr>
                <td><strong>${escapeHtml(e.name)}</strong></td>
                <td>${e.projects.length}</td>
                <td>${e.totalHours.toFixed(1)} u</td>
                <td>${badge}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }
</script>
</body></html>
