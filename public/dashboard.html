<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Dashboard — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <h1>Dashboard</h1>
  <p class="subtle">Planning, omzetvoorspelling en komende deadlines. Voor meer rapportages: <a href="/reports.html">Rapportages</a>. Medewerker-overzicht: <a href="/medewerkers.html">Medewerkers</a>.</p>

  <h2>Planning</h2>
  <div id="planningAlerts"><p class="subtle">Laden…</p></div>

  <h2 style="margin-top:2rem">Voorspelling omzet</h2>
  <div class="card-static" style="margin-bottom:1rem; padding:.75rem 1rem">
    <div style="display:flex; flex-wrap:wrap; gap:.75rem; align-items:center">
      <label style="display:flex; flex-direction:row; align-items:center; gap:.5rem; margin:0; font-weight:500">
        Periode:
        <select id="forecastPeriod" style="width:auto">
          <option value="weeks-4">Komende 4 weken</option>
          <option value="weeks-8">Komende 8 weken</option>
          <option value="weeks-12">Komende 12 weken</option>
          <option value="weeks-26">Komende 26 weken</option>
          <option value="weeks-52">Komende 52 weken</option>
          <option value="month">Specifieke maand</option>
        </select>
      </label>
      <label id="monthPickerWrap" style="display:flex; flex-direction:row; align-items:center; gap:.5rem; margin:0; font-weight:500">
        Maand:
        <input type="month" id="forecastMonth" style="width:auto">
      </label>
      <label id="targetWrap" style="display:flex; flex-direction:row; align-items:center; gap:.5rem; margin:0; font-weight:500">
        Target (€):
        <input type="number" id="forecastTarget" min="0" step="100" style="width:140px" placeholder="bv. 75000">
      </label>
    </div>
    <div id="forecastTotal" class="subtle" style="margin-top:.6rem; display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:baseline"></div>
  </div>
  <div id="forecast"><p class="subtle">Laden…</p></div>

  <h2 style="margin-top:2rem">Komende deadlines</h2>
  <div id="deadlines"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, apiSend, renderTopbar, toast, escapeHtml, statusLabel, deadlineBadge, daysFromNow, fmtEuro, isDutchHoliday } from '/app.js';
  const me = await renderTopbar('/dashboard.html');
  const isAdmin = me?.role === 'admin';

  // Settings
  const settingsResp = await apiGet('/api/admin/settings').catch(() => ({ settings: { employee_capacities: {}, employee_vacations: {}, monthly_revenue_targets: {}, dashboard_planning_employees: [] } }));
  const settings = settingsResp.settings;
  const capacities = settings.employee_capacities || {};
  const vacations = settings.employee_vacations || {};
  let monthlyTargets = settings.monthly_revenue_targets || {};
  const dashboardEmps = new Set(settings.dashboard_planning_employees || []);

  function isoOf(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function isOnVacation(iso, periods) {
    return (periods || []).some((p) => p.start <= iso && iso <= p.end);
  }
  function isUnavailable(d, vacationPeriods) {
    const iso = isoOf(d);
    const dow = d.getDay();
    return dow === 0 || dow === 6 || isOnVacation(iso, vacationPeriods) || isDutchHoliday(iso);
  }
  function workdaysInRange(startD, endD, vacationPeriods) {
    if (startD > endD) return 0;
    let workdays = 0;
    const d = new Date(startD);
    while (d <= endD) {
      if (!isUnavailable(d, vacationPeriods)) workdays++;
      d.setDate(d.getDate() + 1);
    }
    return workdays;
  }
  function estimateCompletionDate(remainingHours, capacityPerWeek, periods) {
    if (!capacityPerWeek || capacityPerWeek <= 0) return null;
    const dailyHours = capacityPerWeek / 5;
    const workDaysNeeded = Math.ceil(remainingHours / dailyHours);
    if (workDaysNeeded === 0) return new Date();
    let d = new Date(); d.setHours(0, 0, 0, 0);
    let worked = 0; let safety = 365 * 5;
    while (worked < workDaysNeeded && safety-- > 0) {
      if (!isUnavailable(d, periods)) {
        worked++;
        if (worked >= workDaysNeeded) return new Date(d);
      }
      d.setDate(d.getDate() + 1);
    }
    return null;
  }
  function fmtDate(iso) { if (!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`; }

  // ── Planning: medewerkers die binnen 7 dagen uit werk lopen ─────
  const basicResp = await apiGet('/api/projects');
  const baseProjects = basicResp.projects;

  function renderPlanningAlerts() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const todayIso = isoOf(today);
    const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() + 7);

    const byEmp = new Map();
    for (const p of baseProjects) {
      if (p.status !== 'in_progress' && p.status !== 'future') continue;
      for (const t of (p.team || [])) {
        if (!dashboardEmps.has(t.moneybird_user_id)) continue;
        const remaining = Math.max(0, (Number(p.available_hours) || 0) - (Number(p.hours_used) || 0));
        if (!byEmp.has(t.moneybird_user_id)) {
          byEmp.set(t.moneybird_user_id, { id: t.moneybird_user_id, name: t.name, totalRemaining: 0 });
        }
        byEmp.get(t.moneybird_user_id).totalRemaining += remaining;
      }
    }

    const alerts = [];
    for (const rec of byEmp.values()) {
      const cap = Number(capacities[rec.id]) || 0;
      const empVacations = (vacations[rec.id] || []).filter((p) => p.end >= todayIso);
      if (rec.totalRemaining <= 0) {
        alerts.push({ name: rec.name, daysLeft: 0, completionIso: null, totalRemaining: 0, cap, kind: 'no_work' });
        continue;
      }
      if (cap <= 0) continue;
      const completion = estimateCompletionDate(rec.totalRemaining, cap, empVacations);
      if (!completion) continue;
      if (completion <= cutoff) {
        const daysLeft = Math.max(0, Math.round((completion - today) / 86400000));
        alerts.push({
          name: rec.name, daysLeft,
          completionIso: isoOf(completion),
          totalRemaining: rec.totalRemaining, cap, kind: 'running_out',
        });
      }
    }
    alerts.sort((a, b) => a.daysLeft - b.daysLeft);

    const el = document.getElementById('planningAlerts');
    if (dashboardEmps.size === 0) {
      el.innerHTML = '<p class="subtle">Geen medewerkers ingesteld voor dashboard-alert. Schakel medewerkers in via <a href="/planning.html">Planning</a>.</p>';
      return;
    }
    if (alerts.length === 0) {
      el.innerHTML = '<p class="subtle">Geen medewerkers die binnen 7 dagen uit hun werk lopen.</p>';
      return;
    }

    el.innerHTML = `
      <div class="card-static" style="border-left:4px solid #ef4444; padding:1rem">
        <div style="font-weight:600; margin-bottom:.5rem">
          ⚠ ${alerts.length} ${alerts.length === 1 ? 'medewerker loopt' : 'medewerkers lopen'} binnen 7 dagen uit ${alerts.length === 1 ? 'het' : 'hun'} werk
        </div>
        <table class="table" style="margin:0">
          <thead><tr><th>Medewerker</th><th>Status</th><th>Resterend</th><th>Capaciteit</th><th>Klaar op</th></tr></thead>
          <tbody>
            ${alerts.map((a) => `
              <tr>
                <td><strong>${escapeHtml(a.name)}</strong></td>
                <td>${a.kind === 'no_work'
                  ? '<span class="badge badge-red">geen werk</span>'
                  : (a.daysLeft === 0
                      ? '<span class="badge badge-red">vandaag klaar</span>'
                      : `<span class="badge badge-orange">${a.daysLeft} ${a.daysLeft === 1 ? 'dag' : 'dagen'}</span>`)}</td>
                <td>${a.totalRemaining.toFixed(1)} u</td>
                <td>${a.cap > 0 ? a.cap + ' u/wk' : '<span class="subtle">—</span>'}</td>
                <td>${a.completionIso ? fmtDate(a.completionIso) : '<span class="subtle">—</span>'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <p class="subtle" style="margin:.5rem 0 0; font-size:.85rem">
          Op basis van toegewezen In progress / Future projecten en ingestelde capaciteit. On hold-projecten tellen niet mee. Ken nieuwe projecten toe via <a href="/planning.html">Planning</a>.
        </p>
      </div>`;
  }
  renderPlanningAlerts();

  // ── Forecast setup ─────────────────────────────────────────────
  const periodSel = document.getElementById('forecastPeriod');
  const monthInput = document.getElementById('forecastMonth');
  const monthWrap = document.getElementById('monthPickerWrap');
  const targetWrap = document.getElementById('targetWrap');
  const targetInput = document.getElementById('forecastTarget');
  const STORAGE_PERIOD = 'pm_forecast_period';
  const STORAGE_MONTH = 'pm_forecast_month';
  const now = new Date();
  const currentMonthIso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  monthInput.value = sessionStorage.getItem(STORAGE_MONTH) || currentMonthIso;
  periodSel.value = sessionStorage.getItem(STORAGE_PERIOD) || 'month';

  function syncTargetInputFromMonth() {
    const monthIso = monthInput.value || currentMonthIso;
    const cur = monthlyTargets[monthIso];
    targetInput.value = (cur && Number(cur) > 0) ? cur : '';
    targetInput.disabled = !isAdmin;
    if (!isAdmin) targetInput.title = 'Alleen admins kunnen het target wijzigen';
  }
  syncTargetInputFromMonth();

  async function saveTarget() {
    if (!isAdmin) return;
    const monthIso = monthInput.value || currentMonthIso;
    const raw = targetInput.value.trim();
    const n = raw === '' ? 0 : Number(raw);
    const next = { ...monthlyTargets };
    if (Number.isFinite(n) && n > 0) next[monthIso] = Math.round(n);
    else delete next[monthIso];
    try {
      const r = await apiSend('/api/admin/settings', 'POST', { monthly_revenue_targets: next });
      monthlyTargets = r.settings.monthly_revenue_targets || {};
      toast('Target opgeslagen', 'success');
      renderForecast();
    } catch (err) { toast(err.message, 'error'); }
  }
  targetInput.addEventListener('change', saveTarget);
  targetInput.addEventListener('blur', saveTarget);

  let projectsWithEntries = null;
  let loadedMonthKey = null;

  async function ensureProjectsForMonth(monthIso) {
    if (loadedMonthKey === monthIso && projectsWithEntries) return projectsWithEntries;
    const r = await apiGet(`/api/projects?with_time_entries=1&time_entries_in_month=${encodeURIComponent(monthIso)}`);
    projectsWithEntries = r.projects;
    loadedMonthKey = monthIso;
    return projectsWithEntries;
  }

  function statsForMonth(projects, monthIso) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const todayIso = isoOf(today);
    const map = new Map();
    for (const p of projects) {
      for (const e of (p.time_entries || [])) {
        if (!e.user_moneybird_id || !e.started_at) continue;
        const day = String(e.started_at).slice(0, 10);
        if (!day.startsWith(monthIso)) continue;
        if (day > todayIso) continue;
        if (!map.has(e.user_moneybird_id)) map.set(e.user_moneybird_id, { hoursByProject: new Map(), total: 0 });
        const rec = map.get(e.user_moneybird_id);
        rec.hoursByProject.set(p.id, (rec.hoursByProject.get(p.id) || 0) + (Number(e.hours) || 0));
        rec.total += Number(e.hours) || 0;
      }
    }
    return map;
  }

  function getFutureWorkdaysInMonth(monthIso, empVacations) {
    const [y, m] = monthIso.split('-').map(Number);
    const firstDay = new Date(y, m - 1, 1);
    const lastDay = new Date(y, m, 0);
    const tomorrow = new Date(); tomorrow.setHours(0,0,0,0); tomorrow.setDate(tomorrow.getDate() + 1);
    const start = tomorrow > firstDay ? tomorrow : firstDay;
    return workdaysInRange(start, lastDay, empVacations);
  }

  function getFutureWorkdaysInWeeks(weeks, empVacations) {
    const today = new Date(); today.setHours(0,0,0,0);
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
    const end = new Date(today); end.setDate(end.getDate() + weeks * 7 - 1);
    return workdaysInRange(tomorrow, end, empVacations);
  }

  async function renderForecast() {
    sessionStorage.setItem(STORAGE_PERIOD, periodSel.value);
    sessionStorage.setItem(STORAGE_MONTH, monthInput.value || '');
    monthWrap.style.display = periodSel.value === 'month' ? '' : 'none';
    targetWrap.style.display = periodSel.value === 'month' ? '' : 'none';
    syncTargetInputFromMonth();

    const isMonth = periodSel.value === 'month';
    const monthIso = monthInput.value || currentMonthIso;

    let projects = baseProjects;
    let pastByEmp = new Map();
    if (isMonth) {
      try {
        projects = await ensureProjectsForMonth(monthIso);
        pastByEmp = statsForMonth(projects, monthIso);
      } catch (err) {
        projects = baseProjects;
        pastByEmp = new Map();
      }
    }

    const inProgress = projects.filter((p) => p.status === 'in_progress' || p.status === 'future');

    const perPerson = new Map();
    for (const p of inProgress) {
      const remaining = Math.max(0, (Number(p.available_hours) || 0) - (Number(p.hours_used) || 0));
      const rate = Number(p.hourly_rate) || 0;
      if (rate <= 0 || !p.team || p.team.length === 0) continue;
      const totalProjectHoursUsed = (p.team_stats || []).reduce((a, s) => a + (Number(s.hours) || 0), 0);
      for (const member of p.team) {
        const stat = (p.team_stats || []).find((s) => s.moneybird_user_id === member.moneybird_user_id);
        const memberHours = stat ? Number(stat.hours) || 0 : 0;
        const shareRatio = totalProjectHoursUsed > 0
          ? (memberHours / totalProjectHoursUsed)
          : (1 / p.team.length);
        const estRemainingHours = remaining > 0 ? shareRatio * remaining : 0;
        if (!perPerson.has(member.moneybird_user_id)) {
          perPerson.set(member.moneybird_user_id, {
            id: member.moneybird_user_id, name: member.name,
            futureBreakdown: [], futureRawHours: 0,
            pastHours: 0, pastRevenue: 0,
          });
        }
        const rec = perPerson.get(member.moneybird_user_id);
        rec.futureBreakdown.push({ project: p, hours: estRemainingHours, rate });
        rec.futureRawHours += estRemainingHours;
      }
    }

    if (isMonth) {
      const projectById = new Map(projects.map((p) => [p.id, p]));
      for (const [empId, pastRec] of pastByEmp.entries()) {
        if (!perPerson.has(empId)) {
          let name = 'Onbekend';
          for (const p of projects) {
            const t = (p.team || []).find((x) => x.moneybird_user_id === empId);
            if (t) { name = t.name; break; }
          }
          perPerson.set(empId, {
            id: empId, name,
            futureBreakdown: [], futureRawHours: 0,
            pastHours: 0, pastRevenue: 0,
          });
        }
        const rec = perPerson.get(empId);
        let pastHrs = 0;
        let pastRev = 0;
        for (const [pid, hrs] of pastRec.hoursByProject.entries()) {
          const proj = projectById.get(pid);
          const rate = proj ? Number(proj.hourly_rate) || 0 : 0;
          pastHrs += hrs;
          pastRev += hrs * rate;
        }
        rec.pastHours = pastHrs;
        rec.pastRevenue = pastRev;
      }
    }

    let grandTotal = 0;
    const rows = [];
    for (const rec of perPerson.values()) {
      const cap = Number(capacities[rec.id]) || 0;
      const empVacations = vacations[rec.id] || [];

      let maxFutureHours = Infinity;
      let periodLabel = '∞';
      if (isMonth) {
        const futWd = getFutureWorkdaysInMonth(monthIso, empVacations);
        periodLabel = cap > 0 ? `${futWd} werkdagen resterend` : `${futWd} werkdagen resterend (geen capaciteit)`;
        if (cap > 0) maxFutureHours = (cap / 5) * futWd;
      } else if (periodSel.value.startsWith('weeks-')) {
        const weeks = Number(periodSel.value.split('-')[1]);
        const futWd = getFutureWorkdaysInWeeks(weeks, empVacations);
        periodLabel = cap > 0 ? `${weeks}w (${futWd} werkdagen)` : `${weeks}w (${futWd} werkdagen, geen capaciteit)`;
        if (cap > 0) maxFutureHours = (cap / 5) * futWd;
      }

      const factor = rec.futureRawHours > maxFutureHours ? maxFutureHours / rec.futureRawHours : 1;
      let futureHours = 0;
      let futureRevenue = 0;
      for (const b of rec.futureBreakdown) {
        const h = b.hours * factor;
        futureHours += h;
        futureRevenue += h * b.rate;
      }

      const pastHours = isMonth ? rec.pastHours : 0;
      const pastRevenue = isMonth ? rec.pastRevenue : 0;
      const totalHours = pastHours + futureHours;
      const totalRevenue = pastRevenue + futureRevenue;
      if (totalRevenue === 0 && totalHours === 0) continue;
      grandTotal += totalRevenue;
      rows.push({
        name: rec.name, cap: cap > 0 ? cap : null,
        pastHours, futureHours, totalHours,
        pastRevenue, futureRevenue, totalRevenue,
        capped: factor < 1, periodLabel,
      });
    }
    rows.sort((a, b) => b.totalRevenue - a.totalRevenue);

    const periodDesc = isMonth ? `maand ${monthIso}` : `komende ${periodSel.value.split('-')[1]} weken`;
    const target = isMonth ? Number(monthlyTargets[monthIso] || 0) : 0;
    let targetHtml = '';
    if (isMonth && target > 0) {
      const diff = grandTotal - target;
      const pct = target > 0 ? Math.round((grandTotal / target) * 100) : 0;
      const onTarget = grandTotal >= target;
      const color = onTarget ? '#10b981' : '#ef4444';
      const icon = onTarget ? '✓' : '⚠';
      const label = onTarget
        ? `target ${fmtEuro(target)} gehaald (+${fmtEuro(Math.max(0, diff))})`
        : `tekort ${fmtEuro(Math.abs(diff))} op target ${fmtEuro(target)}`;
      targetHtml = `<span style="color:${color}; font-weight:600">${icon} ${pct}% — ${label}</span>`;
    }
    document.getElementById('forecastTotal').innerHTML =
      `<span>Totaal verwachte omzet ${periodDesc}: <strong style="color:var(--text)">${fmtEuro(grandTotal)}</strong></span>${targetHtml}`;

    const el = document.getElementById('forecast');
    if (rows.length === 0) {
      el.innerHTML = '<p class="subtle">Geen actieve projecten of geen gewerkte uren in deze periode.</p>';
      return;
    }
    el.innerHTML = `
      <table class="table" style="margin:0">
        <thead><tr>
          <th>Medewerker</th>
          <th>Capaciteit</th>
          ${isMonth ? '<th>Reeds gewerkt</th>' : ''}
          <th>Werkbare uren ${isMonth ? '(rest van maand)' : 'in periode'}</th>
          <th>${isMonth ? 'Totaal uren' : 'Geschatte uren'}</th>
          <th>Verwachte omzet</th>
        </tr></thead>
        <tbody>
          ${rows.map((r) => `
            <tr>
              <td><strong>${escapeHtml(r.name)}</strong></td>
              <td>${r.cap !== null ? r.cap + ' u/wk' : '<span class="subtle">niet ingesteld</span>'}</td>
              ${isMonth ? `<td>${r.pastHours.toFixed(1)} u <span class="subtle">(${fmtEuro(r.pastRevenue)})</span></td>` : ''}
              <td><span class="subtle">${escapeHtml(r.periodLabel)}</span></td>
              <td>
                ${isMonth
                  ? `${r.totalHours.toFixed(1)} u <span class="subtle">(waarvan ${r.futureHours.toFixed(1)} u nog te doen${r.capped ? ', capped' : ''})</span>`
                  : `${r.futureHours.toFixed(1)} u${r.capped ? ' <span class="subtle">(capped)</span>' : ''}`}
              </td>
              <td><strong>${fmtEuro(r.totalRevenue)}</strong></td>
            </tr>`).join('')}
        </tbody>
      </table>
      <p class="subtle" style="margin-top:.5rem">
        ${isMonth
          ? `<strong>Maand-modus:</strong> reeds gewerkte uren in ${monthIso} (uit Moneybird) + geschatte resterende uren (op basis van capaciteit × resterende werkdagen, exclusief weekenden/vakantie/feestdagen, pro-rata verdeeld over teamleden).`
          : 'Werkbare uren = (capaciteit ÷ 5) × werkdagen in de periode, exclusief weekenden, vakantiedagen en Nederlandse feestdagen.'}
      </p>
    `;
  }
  periodSel.addEventListener('change', renderForecast);
  monthInput.addEventListener('change', renderForecast);
  renderForecast();

  // ── Komende deadlines (onderaan) ───────────────────────────────
  const deadlinesEl = document.getElementById('deadlines');
  const withDeadline = baseProjects
    .filter((p) => p.deadline && p.status !== 'done')
    .map((p) => ({ p, days: daysFromNow(p.deadline) }))
    .filter((x) => x.days !== null)
    .sort((a, b) => a.days - b.days)
    .slice(0, 10);
  if (withDeadline.length === 0) {
    deadlinesEl.innerHTML = '<p class="subtle">Geen openstaande deadlines.</p>';
  } else {
    deadlinesEl.innerHTML = `
      <table class="table" style="margin:0">
        <thead><tr><th>Project</th><th>Deadline</th><th>Status</th><th>Uren</th></tr></thead>
        <tbody>
          ${withDeadline.map(({ p }) => `
            <tr class="clickable" data-id="${encodeURIComponent(p.id)}">
              <td><strong>${escapeHtml(p.name)}</strong>${p.is_poc ? ' <span class="badge" style="background:rgba(139,92,246,.15);color:#6d28d9">POC</span>' : ''}</td>
              <td>${deadlineBadge(p.deadline)}</td>
              <td><span class="badge status-${p.status}">${statusLabel(p.status)}</span></td>
              <td>${p.hours_used.toFixed(1)} / ${(p.available_hours || 0).toFixed(1)} u</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
    deadlinesEl.querySelectorAll('tr.clickable').forEach((tr) => {
      tr.onclick = () => location.href = `/project.html?id=${tr.dataset.id}`;
    });
  }
</script>
</body></html>
