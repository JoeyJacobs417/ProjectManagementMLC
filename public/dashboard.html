<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Dashboard — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <h1>Dashboard</h1>
  <p class="subtle">Omzetvoorspelling en komende deadlines. Voor meer rapportages: <a href="/reports.html">Rapportages</a>. Medewerker-overzicht: <a href="/medewerkers.html">Medewerkers</a>.</p>

  <h2>Voorspelling omzet</h2>
  <div class="card-static" style="margin-bottom:1rem; padding:.75rem 1rem">
    <div style="display:flex; flex-wrap:wrap; gap:.75rem; align-items:center">
      <label style="display:flex; flex-direction:row; align-items:center; gap:.5rem; margin:0; font-weight:500">
        Periode:
        <select id="forecastPeriod" style="width:auto">
          <option value="weeks-4">Komende 4 weken</option>
          <option value="weeks-8">Komende 8 weken</option>
          <option value="weeks-12">Komende 12 weken</option>
          <option value="weeks-26">Komende 26 weken</option>
          <option value="weeks-52">Komende 52 weken</option>
          <option value="month">Specifieke maand</option>
        </select>
      </label>
      <label id="monthPickerWrap" style="display:flex; flex-direction:row; align-items:center; gap:.5rem; margin:0; font-weight:500">
        Maand:
        <input type="month" id="forecastMonth" style="width:auto">
      </label>
      <label id="targetWrap" style="display:flex; flex-direction:row; align-items:center; gap:.5rem; margin:0; font-weight:500">
        Target (€):
        <input type="number" id="forecastTarget" min="0" step="100" style="width:140px" placeholder="bv. 75000">
      </label>
    </div>
    <div id="forecastTotal" class="subtle" style="margin-top:.6rem; display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:baseline"></div>
  </div>
  <div id="forecast"><p class="subtle">Laden…</p></div>

  <h2 style="margin-top:2rem">Komende deadlines</h2>
  <div id="deadlines"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, apiSend, renderTopbar, toast, escapeHtml, statusLabel, deadlineBadge, daysFromNow, fmtEuro, isDutchHoliday } from '/app.js';
  const me = await renderTopbar('/dashboard.html');
  const isAdmin = me?.role === 'admin';

  // Settings
  const settingsResp = await apiGet('/api/admin/settings').catch(() => ({ settings: { employee_capacities: {}, employee_vacations: {}, monthly_revenue_targets: {}, dashboard_planning_employees: [] } }));
  const settings = settingsResp.settings;
  const capacities = settings.employee_capacities || {};
  const vacations = settings.employee_vacations || {};
  let monthlyTargets = settings.monthly_revenue_targets || {};

  function isoOf(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function isOnVacation(iso, periods) {
    return (periods || []).some((p) => p.start <= iso && iso <= p.end);
  }
  function isUnavailable(d, vacationPeriods) {
    const iso = isoOf(d);
    const dow = d.getDay();
    return dow === 0 || dow === 6 || isOnVacation(iso, vacationPeriods) || isDutchHoliday(iso);
  }
  function workdaysInRange(startD, endD, vacationPeriods) {
    if (startD > endD) return 0;
    let workdays = 0;
    const d = new Date(startD);
    while (d <= endD) {
      if (!isUnavailable(d, vacationPeriods)) workdays++;
      d.setDate(d.getDate() + 1);
    }
    return workdays;
  }
  function fmtDate(iso) { if (!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`; }

  const basicResp = await apiGet('/api/projects');
  const baseProjects = basicResp.projects;

  // ── Forecast setup ─────────────────────────────────────────────
  const periodSel = document.getElementById('forecastPeriod');
  const monthInput = document.getElementById('forecastMonth');
  const monthWrap = document.getElementById('monthPickerWrap');
  const targetWrap = document.getElementById('targetWrap');
  const targetInput = document.getElementById('forecastTarget');
  const STORAGE_PERIOD = 'pm_forecast_period';
  const STORAGE_MONTH = 'pm_forecast_month';
  const now = new Date();
  const currentMonthIso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  monthInput.value = sessionStorage.getItem(STORAGE_MONTH) || currentMonthIso;
  periodSel.value = sessionStorage.getItem(STORAGE_PERIOD) || 'month';

  function syncTargetInputFromMonth() {
    const monthIso = monthInput.value || currentMonthIso;
    const cur = monthlyTargets[monthIso];
    targetInput.value = (cur && Number(cur) > 0) ? cur : '';
    targetInput.disabled = !isAdmin;
    if (!isAdmin) targetInput.title = 'Alleen admins kunnen het target wijzigen';
  }
  syncTargetInputFromMonth();

  async function saveTarget() {
    if (!isAdmin) return;
    const monthIso = monthInput.value || currentMonthIso;
    const raw = targetInput.value.trim();
    const n = raw === '' ? 0 : Number(raw);
    const next = { ...monthlyTargets };
    if (Number.isFinite(n) && n > 0) next[monthIso] = Math.round(n);
    else delete next[monthIso];
    try {
      const r = await apiSend('/api/admin/settings', 'POST', { monthly_revenue_targets: next });
      monthlyTargets = r.settings.monthly_revenue_targets || {};
      toast('Target opgeslagen', 'success');
      renderForecast();
    } catch (err) { toast(err.message, 'error'); }
  }
  targetInput.addEventListener('change', saveTarget);
  targetInput.addEventListener('blur', saveTarget);

  let projectsWithEntries = null;
  let loadedMonthKey = null;

  async function ensureProjectsForMonth(monthIso) {
    if (loadedMonthKey === monthIso && projectsWithEntries) return projectsWithEntries;
    const r = await apiGet(`/api/projects?with_time_entries=1&time_entries_in_month=${encodeURIComponent(monthIso)}`);
    projectsWithEntries = r.projects;
    loadedMonthKey = monthIso;
    return projectsWithEntries;
  }

  // Gemiddeld uurtarief voor de potentiele omzet-kolom.
  const AVG_HOURLY_RATE = 145;

  // Bereken per medewerker hoeveel uur DECLARABEL in de maand is gewerkt + bijbehorende omzet.
  // Cap per project: voor niet-uurtje-factuurtje stoppen we bij available_hours;
  // voor uurtje-factuurtje tellen alle uren.
  function computeRealizedForMonth(projects, monthIso, todayIso) {
    const out = new Map();
    for (const p of projects) {
      const rate = Number(p.hourly_rate) || 0;
      if (rate <= 0) continue;
      const entries = (p.time_entries || []).filter((e) => {
        if (!e.started_at) return false;
        const day = String(e.started_at).slice(0, 10);
        return day.startsWith(monthIso) && day <= todayIso;
      });
      if (entries.length === 0) continue;
      const hoursInMonth = entries.reduce((a, e) => a + (Number(e.hours) || 0), 0);
      if (hoursInMonth <= 0) continue;
      const hoursTotal = Number(p.hours_used) || 0;
      const hoursBefore = Math.max(0, hoursTotal - hoursInMonth);
      let declarableInMonth;
      if (p.is_hourly_billing) {
        declarableInMonth = hoursInMonth;
      } else {
        const cap = Math.max(0, (Number(p.available_hours) || 0) - hoursBefore);
        declarableInMonth = Math.min(cap, hoursInMonth);
      }
      if (declarableInMonth <= 0) continue;
      const byMember = new Map();
      for (const e of entries) {
        if (!e.user_moneybird_id) continue;
        byMember.set(e.user_moneybird_id, (byMember.get(e.user_moneybird_id) || 0) + (Number(e.hours) || 0));
      }
      for (const [memberId, memberHours] of byMember) {
        const memberDeclarable = (memberHours / hoursInMonth) * declarableInMonth;
        const cur = out.get(memberId) || { hours: 0, revenue: 0 };
        cur.hours += memberDeclarable;
        cur.revenue += memberDeclarable * rate;
        out.set(memberId, cur);
      }
    }
    return out;
  }

  // Bereken per medewerker hoeveel uur is ingepland (in weekly_allocations) voor de gegeven
  // week-starts. Per project gecapped op remaining (tenzij uurtje-factuurtje).
  function computePlannedForWeeks(projects, weekStartsInPeriod) {
    const weekSet = new Set(weekStartsInPeriod);
    const out = new Map();
    for (const p of projects) {
      if (p.status === 'done') continue;
      const rate = Number(p.hourly_rate) || 0;
      if (rate <= 0) continue;
      const allocs = (p.weekly_allocations || []).filter((a) => weekSet.has(a.week_start));
      if (allocs.length === 0) continue;
      const byMember = new Map();
      for (const a of allocs) {
        const h = Number(a.hours) || 0;
        if (h <= 0) continue;
        byMember.set(a.moneybird_user_id, (byMember.get(a.moneybird_user_id) || 0) + h);
      }
      const totalAlloc = Array.from(byMember.values()).reduce((a, h) => a + h, 0);
      if (totalAlloc <= 0) continue;
      let cappedTotal = totalAlloc;
      if (!p.is_hourly_billing) {
        const remaining = Math.max(0, (Number(p.available_hours) || 0) - (Number(p.hours_used) || 0));
        cappedTotal = Math.min(totalAlloc, remaining);
      }
      if (cappedTotal <= 0) continue;
      const factor = cappedTotal / totalAlloc;
      for (const [memberId, memberHours] of byMember) {
        const capped = memberHours * factor;
        const cur = out.get(memberId) || { hours: 0, revenue: 0 };
        cur.hours += capped;
        cur.revenue += capped * rate;
        out.set(memberId, cur);
      }
    }
    return out;
  }

  // De 4 maandagen (huidige + 3 vooruit) die in een gegeven periode vallen.
  function weekStartsForPeriod(periodValue, monthIso) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const dow = today.getDay();
    const diff = dow === 0 ? -6 : 1 - dow;
    const thisMonday = new Date(today); thisMonday.setDate(thisMonday.getDate() + diff);
    const all = [];
    for (let i = 0; i < 4; i++) {
      const d = new Date(thisMonday); d.setDate(d.getDate() + i * 7);
      all.push(isoOf(d));
    }
    if (periodValue === 'month') {
      const [y, m] = monthIso.split('-').map(Number);
      const lastDayNum = new Date(y, m, 0).getDate();
      const firstDay = `${monthIso}-01`;
      const lastDay = `${monthIso}-${String(lastDayNum).padStart(2, '0')}`;
      return all.filter((w) => w >= firstDay && w <= lastDay);
    }
    if (periodValue.startsWith('weeks-')) {
      const weeks = Number(periodValue.split('-')[1]);
      const startIso = isoOf(thisMonday);
      const end = new Date(today); end.setDate(end.getDate() + weeks * 7 - 1);
      const endIso = isoOf(end);
      return all.filter((w) => w >= startIso && w <= endIso);
    }
    return [];
  }

  function getFutureWorkdaysInMonth(monthIso, empVacations) {
    const [y, m] = monthIso.split('-').map(Number);
    const firstDay = new Date(y, m - 1, 1);
    const lastDay = new Date(y, m, 0);
    const tomorrow = new Date(); tomorrow.setHours(0,0,0,0); tomorrow.setDate(tomorrow.getDate() + 1);
    const start = tomorrow > firstDay ? tomorrow : firstDay;
    return workdaysInRange(start, lastDay, empVacations);
  }

  function getFutureWorkdaysInWeeks(weeks, empVacations) {
    const today = new Date(); today.setHours(0,0,0,0);
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
    const end = new Date(today); end.setDate(end.getDate() + weeks * 7 - 1);
    return workdaysInRange(tomorrow, end, empVacations);
  }

  async function renderForecast() {
    sessionStorage.setItem(STORAGE_PERIOD, periodSel.value);
    sessionStorage.setItem(STORAGE_MONTH, monthInput.value || '');
    monthWrap.style.display = periodSel.value === 'month' ? '' : 'none';
    targetWrap.style.display = periodSel.value === 'month' ? '' : 'none';
    syncTargetInputFromMonth();

    const isMonth = periodSel.value === 'month';
    const monthIso = monthInput.value || currentMonthIso;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const todayIsoStr = isoOf(today);

    let projects = baseProjects;
    if (isMonth) {
      try { projects = await ensureProjectsForMonth(monthIso); }
      catch (err) { projects = baseProjects; }
    }

    // Verzamel alle relevante medewerkers (uit team van niet-done projecten + uit time entries in maand).
    const empMap = new Map();
    function ensureEmp(id, name) {
      if (!empMap.has(id)) {
        empMap.set(id, {
          id, name: name || 'Onbekend',
          realizedHours: 0, realizedRevenue: 0,
          plannedHours: 0, plannedRevenue: 0,
          potentialRevenue: 0,
        });
      }
      return empMap.get(id);
    }
    for (const p of projects) {
      if (p.status === 'done') continue;
      for (const t of (p.team || [])) ensureEmp(t.moneybird_user_id, t.name);
    }
    if (isMonth) {
      for (const p of projects) {
        for (const e of (p.time_entries || [])) {
          if (e.user_moneybird_id) ensureEmp(e.user_moneybird_id, e.user_name);
        }
      }
    }

    // Reeds omgezet (alleen in maand-mode; weken-vooruit modes hebben geen verleden in de periode).
    if (isMonth) {
      const realized = computeRealizedForMonth(projects, monthIso, todayIsoStr);
      for (const [empId, r] of realized) {
        const rec = ensureEmp(empId);
        rec.realizedHours = r.hours;
        rec.realizedRevenue = r.revenue;
      }
    }

    // Geplande omzet (uit weekly_allocations op de week-starts die in de periode vallen).
    const weekStarts = weekStartsForPeriod(periodSel.value, monthIso);
    const planned = computePlannedForWeeks(projects, weekStarts);
    for (const [empId, pl] of planned) {
      const rec = ensureEmp(empId);
      rec.plannedHours = pl.hours;
      rec.plannedRevenue = pl.revenue;
    }

    // Potentiele omzet = werkbare uren in de periode × €145 (per medewerker o.b.v. capaciteit).
    for (const rec of empMap.values()) {
      const cap = Number(capacities[rec.id]) || 0;
      if (cap <= 0) continue;
      const empVacations = vacations[rec.id] || [];
      let workdays = 0;
      if (isMonth) workdays = getFutureWorkdaysInMonth(monthIso, empVacations);
      else if (periodSel.value.startsWith('weeks-')) {
        const weeks = Number(periodSel.value.split('-')[1]);
        workdays = getFutureWorkdaysInWeeks(weeks, empVacations);
      }
      rec.potentialRevenue = (cap / 5) * workdays * AVG_HOURLY_RATE;
    }

    const rows = Array.from(empMap.values())
      .map((r) => ({ ...r, forecastRevenue: r.realizedRevenue + r.plannedRevenue }))
      .filter((r) => r.realizedRevenue > 0 || r.plannedRevenue > 0 || r.potentialRevenue > 0)
      .sort((a, b) => b.forecastRevenue - a.forecastRevenue);

    const grandTotal = rows.reduce((a, r) => a + r.forecastRevenue, 0);
    const periodDesc = isMonth ? `maand ${monthIso}` : `komende ${periodSel.value.split('-')[1]} weken`;
    const target = isMonth ? Number(monthlyTargets[monthIso] || 0) : 0;
    let targetHtml = '';
    if (isMonth && target > 0) {
      const diff = grandTotal - target;
      const pct = target > 0 ? Math.round((grandTotal / target) * 100) : 0;
      const onTarget = grandTotal >= target;
      const color = onTarget ? '#10b981' : '#ef4444';
      const icon = onTarget ? '✓' : '⚠';
      const label = onTarget
        ? `target ${fmtEuro(target)} gehaald (+${fmtEuro(Math.max(0, diff))})`
        : `tekort ${fmtEuro(Math.abs(diff))} op target ${fmtEuro(target)}`;
      targetHtml = `<span style="color:${color}; font-weight:600">${icon} ${pct}% — ${label}</span>`;
    }
    document.getElementById('forecastTotal').innerHTML =
      `<span>Totaal voorspelde omzet ${periodDesc}: <strong style="color:var(--text)">${fmtEuro(grandTotal)}</strong></span>${targetHtml}`;

    const el = document.getElementById('forecast');
    if (rows.length === 0) {
      el.innerHTML = '<p class="subtle">Geen actieve projecten of geen gewerkte uren in deze periode.</p>';
      return;
    }
    el.innerHTML = `
      <table class="table" style="margin:0">
        <thead><tr>
          <th>Medewerker</th>
          <th title="Declarabele uren in deze periode × uurtarief. Voor projecten zonder uurtje-factuurtje tellen alleen uren tot 100% verbruikt.">Reeds omgezet</th>
          <th title="Werkbare uren in de periode × € ${AVG_HOURLY_RATE} (gemiddeld uurtarief).">Potentiele omzet</th>
          <th title="Ingeplande uren op de pagina Planning × uurtarief. Per project gecapped op resterend budget (tenzij uurtje-factuurtje).">Geplande omzet</th>
          <th title="Reeds omgezet + Geplande omzet.">Voorspelde omzet</th>
        </tr></thead>
        <tbody>
          ${rows.map((r) => `
            <tr>
              <td><strong>${escapeHtml(r.name)}</strong></td>
              <td>${r.realizedRevenue > 0
                ? `<strong>${fmtEuro(r.realizedRevenue)}</strong> <span class="subtle">(${r.realizedHours.toFixed(1)} u)</span>`
                : '<span class="subtle">—</span>'}</td>
              <td>${r.potentialRevenue > 0
                ? fmtEuro(r.potentialRevenue)
                : '<span class="subtle">geen capaciteit</span>'}</td>
              <td>${r.plannedRevenue > 0
                ? `<strong>${fmtEuro(r.plannedRevenue)}</strong> <span class="subtle">(${r.plannedHours.toFixed(1)} u)</span>`
                : '<span class="subtle">—</span>'}</td>
              <td><strong>${fmtEuro(r.forecastRevenue)}</strong></td>
            </tr>`).join('')}
        </tbody>
      </table>
      <p class="subtle" style="margin-top:.5rem; font-size:.85rem">
        <strong>Reeds omgezet</strong> = uren in deze periode × uurtarief (per project gecapped op 100% verbruikt, tenzij uurtje-factuurtje).
        <strong>Potentiele omzet</strong> = werkbare uren in de periode (capaciteit ÷ 5 × werkdagen, excl. weekend/vakantie/feestdagen) × € ${AVG_HOURLY_RATE}.
        <strong>Geplande omzet</strong> = ingeplande uren (Planning-pagina) × uurtarief, per project gecapped op resterend budget tenzij uurtje-factuurtje.
        <strong>Voorspelde omzet</strong> = Reeds + Geplande.
      </p>
    `;
  }
  periodSel.addEventListener('change', renderForecast);
  monthInput.addEventListener('change', renderForecast);
  renderForecast();

  // ── Komende deadlines (onderaan) ───────────────────────────────
  // Eén rij per deadline (een project kan er meerdere hebben).
  const deadlinesEl = document.getElementById('deadlines');
  const deadlineRows = [];
  for (const p of baseProjects) {
    if (p.status === 'done') continue;
    const list = (p.deadlines && p.deadlines.length) ? p.deadlines : (p.deadline ? [{ date: p.deadline, description: '' }] : []);
    for (const d of list) {
      const days = daysFromNow(d.date);
      if (days === null) continue;
      deadlineRows.push({ p, date: d.date, description: d.description || '', days });
    }
  }
  deadlineRows.sort((a, b) => a.days - b.days);
  const shownDeadlines = deadlineRows.slice(0, 15);
  if (shownDeadlines.length === 0) {
    deadlinesEl.innerHTML = '<p class="subtle">Geen openstaande deadlines.</p>';
  } else {
    deadlinesEl.innerHTML = `
      <table class="table" style="margin:0">
        <thead><tr><th>Project</th><th>Deadline</th><th>Omschrijving</th><th>Projectmanager</th><th>Status</th><th>Uren</th></tr></thead>
        <tbody>
          ${shownDeadlines.map(({ p, date, description }) => `
            <tr class="clickable" data-id="${encodeURIComponent(p.id)}">
              <td><strong>${escapeHtml(p.name)}</strong>${p.is_poc ? ' <span class="badge" style="background:rgba(139,92,246,.15);color:#6d28d9">POC</span>' : ''}</td>
              <td>${deadlineBadge(date)}</td>
              <td>${description ? escapeHtml(description) : '<span class="subtle">—</span>'}</td>
              <td>${escapeHtml(p.manager_name || '—')}</td>
              <td><span class="badge status-${p.status}">${statusLabel(p.status)}</span></td>
              <td>${p.hours_used.toFixed(1)} / ${(p.available_hours || 0).toFixed(1)} u</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
    deadlinesEl.querySelectorAll('tr.clickable').forEach((tr) => {
      tr.onclick = () => location.href = `/project.html?id=${tr.dataset.id}`;
    });
  }
</script>
</body></html>
