<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Project — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <div id="content"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, apiSend, renderTopbar, toast, escapeHtml, progressBarClass } from '/app.js';
  await renderTopbar('/projects.html');

  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('content').innerHTML = '<p>Geen project-ID.</p>'; throw new Error('no id'); }

  const { project } = await apiGet(`/api/projects/${encodeURIComponent(id)}`);
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="page-header">
      <div>
        <h1>${escapeHtml(project.name)}</h1>
        <p class="subtle">PM: ${escapeHtml(project.manager_name || '—')}</p>
      </div>
      <button class="btn btn-primary" id="syncBtn">Synchroniseer Moneybird</button>
    </div>

    <div class="grid grid-2">
      <div class="card-static">
        <h3>Beschrijving</h3>
        <p>${escapeHtml(project.description || '—')}</p>
        ${project.exceptions ? `<h3>Uitzonderingen / afspraken</h3><p>${escapeHtml(project.exceptions)}</p>` : ''}
        ${project.source_pdf_filename ? `<p class="subtle">Bron-PDF: ${escapeHtml(project.source_pdf_filename)}</p>` : ''}
      </div>
      <div class="card-static">
        <h3>Uren</h3>
        <p><strong>Verbruikt:</strong> ${project.hours_used.toFixed(1)} uur</p>
        <p><strong>Beschikbaar:</strong> ${(project.available_hours || 0).toFixed(1)} uur</p>
        <p><strong>Uurtarief:</strong> € ${(project.hourly_rate || 0).toFixed(2)}</p>
        <div class="progress big">
          <div class="progress-bar ${progressBarClass(project.percentage_used)}" style="width:${Math.min(project.percentage_used, 100)}%"></div>
        </div>
        <p><strong>${project.percentage_used}%</strong> verbruikt</p>
      </div>
    </div>

    ${(project.phases && project.phases.length) ? `
      <h2>Fases</h2>
      <table class="table">
        <thead><tr><th>Fase</th><th>Beschrijving</th><th>Uren</th></tr></thead>
        <tbody>
          ${project.phases.map((p) => `
            <tr>
              <td><strong>${escapeHtml(p.name)}</strong></td>
              <td>${escapeHtml(p.description || '')}</td>
              <td>${(Number(p.hours) || 0).toFixed(1)}</td>
            </tr>`).join('')}
        </tbody>
      </table>` : ''}

    <h2>Uren in de tijd</h2>
    <div class="card-static"><canvas id="hoursOverTime" height="120"></canvas></div>
    <h2>Uren per medewerker</h2>
    <div class="card-static"><canvas id="hoursPerUser" height="120"></canvas></div>
  `;

  document.getElementById('syncBtn').onclick = async () => {
    try {
      const r = await apiSend(`/api/projects/${encodeURIComponent(id)}/sync`, 'POST');
      toast(`${r.count} entries gesynchroniseerd`, 'success');
      setTimeout(() => location.reload(), 800);
    } catch (err) {
      toast(err.message, 'error');
    }
  };

  const overTime = await apiGet(`/api/projects/${encodeURIComponent(id)}/hours-over-time`);
  const ctx1 = document.getElementById('hoursOverTime');
  const datasets = [
    { label: 'Uren per dag', data: overTime.daily, backgroundColor: 'rgba(99,102,241,0.4)', borderColor: '#6366f1', type: 'bar' },
    { label: 'Cumulatief', data: overTime.cumulative, borderColor: '#0ea5e9', backgroundColor: 'rgba(14,165,233,0.1)', fill: true, type: 'line', tension: .3 },
  ];
  if (overTime.available > 0) {
    datasets.push({
      label: 'Beschikbaar (max)',
      data: overTime.labels.map(() => overTime.available),
      borderColor: '#ef4444', borderDash: [6, 6], pointRadius: 0, type: 'line', fill: false,
    });
  }
  new Chart(ctx1, { type: 'bar', data: { labels: overTime.labels, datasets }, options: { responsive: true, interaction: { mode: 'index' } } });

  const perUser = await apiGet(`/api/projects/${encodeURIComponent(id)}/hours-per-user`);
  new Chart(document.getElementById('hoursPerUser'), {
    type: 'bar',
    data: { labels: perUser.labels, datasets: [{ label: 'Uren', data: perUser.hours, backgroundColor: '#6366f1' }] },
    options: { indexAxis: 'y', responsive: true },
  });
</script>
</body></html>
