<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Project — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <div id="content"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, apiSend, renderTopbar, toast, escapeHtml, progressBarClass, STATUS_OPTIONS, MODULE_OPTIONS, statusLabel, deadlineBadge, fmtDate, fmtDateTime, activityDescription } from '/app.js';
  const me = await renderTopbar('/projects.html');

  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('content').innerHTML = '<p>Geen project-ID.</p>'; throw new Error('no id'); }

  let project, managers = [], chartsRendered = false;

  async function load() {
    const r = await apiGet(`/api/projects/${encodeURIComponent(id)}`);
    project = r.project;
    if (me.role === 'admin' && managers.length === 0) {
      const u = await apiGet('/api/admin/users').catch(() => ({ users: [] }));
      managers = (u.users || []).filter((x) => x.active);
    }
    render();
  }

  async function deleteProjectFlow() {
    const confirm1 = prompt(`Type de projectnaam om te bevestigen dat je "${project.name}" wilt verwijderen.\n\nDit verwijdert ook alle uren, notities, PDF en activity log. Dit kan NIET ongedaan worden gemaakt.`);
    if (confirm1 === null) return;
    if (confirm1.trim() !== project.name) {
      toast('Naam komt niet overeen — verwijderen geannuleerd', 'error');
      return;
    }
    try {
      await apiSend(`/api/projects/${encodeURIComponent(id)}`, 'DELETE');
      toast('Project verwijderd', 'success');
      setTimeout(() => { location.href = '/projects.html'; }, 600);
    } catch (err) { toast(err.message, 'error'); }
  }

  function render() {
    const c = document.getElementById('content');
    const statusOptions = STATUS_OPTIONS.map((o) =>
      `<option value="${o.value}" ${o.value === project.status ? 'selected' : ''}>${o.label}</option>`).join('');
    const managerOptions = `<option value="">— Geen —</option>` + managers.map((m) =>
      `<option value="${m.id}" ${m.id === project.manager_id ? 'selected' : ''}>${escapeHtml(m.name)} (${escapeHtml(m.email)})</option>`).join('');
    const canEditManager = me.role === 'admin';
    const canDelete = me.role === 'admin';
    const contactRows = (project.contacts && project.contacts.length ? project.contacts : [{ name: '', email: '', receives_threshold_mails: false }]).map((c) => `
      <tr>
        <td><input type="text" data-contact="name" value="${escapeHtml(c.name || '')}"></td>
        <td><input type="email" data-contact="email" value="${escapeHtml(c.email || '')}"></td>
        <td style="text-align:center"><input type="checkbox" data-contact="receives_threshold_mails" ${c.receives_threshold_mails ? 'checked' : ''} style="width:auto"></td>
        <td><button class="btn btn-ghost" type="button" data-remove>Verwijder</button></td>
      </tr>`).join('');

    const projectModules = project.modules || [];

    const notesHtml = (project.notes && project.notes.length > 0)
      ? [...project.notes].reverse().map((n) => `
          <div style="border-top:1px solid var(--border); padding:.6rem 0">
            <div class="subtle" style="font-size:.8rem">
              <strong>${escapeHtml(n.author_name)}</strong> · ${new Date(n.created_at).toLocaleString('nl-NL')}
              ${(me.role === 'admin' || n.author_id === me.id) ? `<a href="#" data-delete-note="${n.id}" style="margin-left:.5rem">verwijder</a>` : ''}
            </div>
            <div style="white-space:pre-wrap; margin-top:.2rem; font-size:.92rem">${escapeHtml(n.text)}</div>
          </div>`).join('')
      : '<p class="subtle" style="margin:0">Nog geen notities.</p>';

    c.innerHTML = `
      <div class="page-header">
        <div style="flex:1">
          <div class="card-header-row" style="margin-bottom:.25rem">
            <h1 id="projectTitle" style="margin:0">${escapeHtml(project.name)}</h1>
            <button class="btn btn-ghost" id="renameBtn" style="font-size:.8rem; padding:.3rem .6rem">✏ Hernoem</button>
            <span class="badge status-${project.status}">${statusLabel(project.status)}</span>
            ${projectModules.map((m) => `<span class="badge badge-blue">${escapeHtml(m)}</span>`).join('')}
            ${project.is_poc ? `<span class="badge" style="background:rgba(139,92,246,.15);color:#6d28d9">POC</span>` : ''}
            ${project.deadline ? deadlineBadge(project.deadline) : ''}
          </div>
          <p class="subtle">
            PM: ${escapeHtml(project.manager_name || '—')}
            ${project.start_date ? ` · Start: ${fmtDate(project.start_date)}` : ''}
            ${project.last_synced_at ? ` · Laatst gesynced: ${fmtDateTime(project.last_synced_at)}` : ''}
          </p>
        </div>
        <div style="display:flex; gap:.5rem">
          ${project.has_pdf ? `<a class="btn btn-ghost" href="/api/projects/${encodeURIComponent(id)}?action=download_pdf" download>⬇ Offerte-PDF</a>` : ''}
          <button class="btn btn-primary" id="syncBtn">Synchroniseer Moneybird</button>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="card-static">
          <h3 style="margin-top:0">Notities</h3>
          <form id="noteForm" class="form" style="margin-bottom:.75rem">
            <label><textarea name="text" rows="2" placeholder="Voeg een notitie toe (klant belde, afspraak verzet, …)"></textarea></label>
            <div><button class="btn btn-primary" type="submit">+ Notitie toevoegen</button></div>
          </form>
          <div id="notesList" style="max-height:300px; overflow-y:auto">
            ${notesHtml}
          </div>
        </div>
        <div class="card-static">
          <h3 style="margin-top:0">Uren & Planning</h3>
          <p><strong>Verbruikt:</strong> ${project.hours_used.toFixed(1)} uur</p>
          <p><strong>Beschikbaar:</strong> ${(project.available_hours || 0).toFixed(1)} uur</p>
          <p><strong>Uurtarief:</strong> € ${(project.hourly_rate || 0).toFixed(2)}</p>
          ${project.start_date ? `<p><strong>Startdatum:</strong> ${fmtDate(project.start_date)}</p>` : ''}
          ${project.deadline ? `<p><strong>Deadline:</strong> ${fmtDate(project.deadline)}</p>` : ''}
          <div class="progress big">
            <div class="progress-bar ${progressBarClass(project.percentage_used)}" style="width:${Math.min(project.percentage_used, 100)}%"></div>
          </div>
          <p><strong>${project.percentage_used}%</strong> verbruikt</p>
        </div>
      </div>

      <div class="card-static" style="margin-top:1rem">
        <h3>Beschrijving</h3>
        <p>${escapeHtml(project.description || '—')}</p>
        ${project.exceptions ? `<h3>Uitzonderingen / afspraken</h3><p>${escapeHtml(project.exceptions)}</p>` : ''}
        ${project.feature_requests ? `<h3>Feature requests</h3><p style="white-space:pre-wrap">${escapeHtml(project.feature_requests)}</p>` : ''}
        ${project.source_pdf_filename ? `<p class="subtle">Bron-PDF: ${escapeHtml(project.source_pdf_filename)}${project.has_pdf ? '' : ' (niet meer beschikbaar)'}</p>` : ''}
        ${(project.contacts && project.contacts.length) ? `
          <h3>Contactpersonen</h3>
          <ul style="margin:.25rem 0 0; padding-left:1.2rem">
            ${project.contacts.map((c) => `
              <li>${escapeHtml(c.name || '')}${c.email ? ` — <a href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a>` : ''}${c.receives_threshold_mails ? ' <span class="badge badge-blue" title="ontvangt urenverbruik-mails">📧 alerts</span>' : ''}</li>`).join('')}
          </ul>` : ''}
      </div>

      <h2>Offerte / voorstel-PDF</h2>
      <div class="card-static">
        ${project.has_pdf
          ? `<p>Er is een PDF opgeslagen: <strong>${escapeHtml(project.source_pdf_filename || 'offerte.pdf')}</strong>.
             <a href="/api/projects/${encodeURIComponent(id)}?action=download_pdf" download>Download</a>.</p>`
          : '<p class="subtle">Nog geen PDF gekoppeld aan dit project.</p>'}
        <form id="pdfUploadForm" class="form" style="margin-top:.5rem">
          <label>${project.has_pdf ? 'Vervang' : 'Upload'} PDF
            <input type="file" name="pdf" accept="application/pdf" required>
          </label>
          <div><button class="btn btn-primary" type="submit">Upload PDF</button></div>
        </form>
      </div>

      <div class="card-static" style="margin-top:1rem">
        <h3>Project bewerken</h3>
        <form id="editForm" class="form">
          <label>Korte beschrijving<textarea name="description" rows="3">${escapeHtml(project.description || '')}</textarea></label>

          <div class="form-row">
            <label>Beschikbare uren<input type="number" step="0.1" name="available_hours" value="${project.available_hours || 0}"></label>
            <label>Uurtarief (€)<input type="number" step="0.01" name="hourly_rate" value="${project.hourly_rate || 0}"></label>
            <label><span class="lbl">Status</span><select name="status">${statusOptions}</select></label>
          </div>

          <h4>Modules <span class="required">*</span> <span class="subtle" style="font-weight:400">(minstens 1 verplicht — meerdere mogelijk)</span></h4>
          <div class="checkbox-grid" id="modulesGrid">
            ${MODULE_OPTIONS.map((m) => `
              <label>
                <input type="checkbox" name="modules" value="${m}" ${projectModules.includes(m) ? 'checked' : ''}>
                ${m}
              </label>`).join('')}
          </div>

          <div class="form-row">
            <label style="align-self:end; display:flex; flex-direction:row; align-items:center; gap:.4rem; font-weight:500">
              <input type="checkbox" name="is_poc" style="width:auto" ${project.is_poc ? 'checked' : ''}> Dit is een POC
            </label>
            <label></label>
            <label></label>
          </div>

          <div class="form-row">
            <label><span class="lbl">Startdatum</span><input type="date" name="start_date" value="${escapeHtml(project.start_date || '')}"></label>
            <label><span class="lbl">Deadline</span><input type="date" name="deadline" value="${escapeHtml(project.deadline || '')}"></label>
            ${canEditManager ? `
              <label><span class="lbl">Projectmanager</span><select name="manager_id">${managerOptions}</select></label>` : '<label></label>'}
          </div>

          <label>Uitzonderingen / afspraken<textarea name="exceptions" rows="3">${escapeHtml(project.exceptions || '')}</textarea></label>

          <label>
            <span class="lbl">Feature requests</span>
            <textarea name="feature_requests" rows="5">${escapeHtml(project.feature_requests || '')}</textarea>
          </label>

          <h4>Contactpersonen bij de klant</h4>
          <table class="table">
            <thead><tr>
              <th>Naam</th><th>E-mailadres</th>
              <th style="text-align:center">Ontvangt urenverbruik-mails</th><th></th>
            </tr></thead>
            <tbody id="contactsBody">${contactRows}</tbody>
          </table>
          <button type="button" class="btn btn-ghost" id="addContact">+ Contact toevoegen</button>

          <h4>Team</h4>
          <div id="teamGrid" class="checkbox-grid"><span class="subtle">Medewerkers laden…</span></div>

          <div style="margin-top:1rem">
            <button class="btn btn-primary" type="submit">Wijzigingen opslaan</button>
            ${project.has_pdf ? `<button class="btn btn-ghost" type="button" id="deletePdfBtn">Verwijder opgeslagen PDF</button>` : ''}
          </div>
        </form>
      </div>

      ${(project.team_stats && project.team_stats.length) ? `
        <h2>Uren per teamlid</h2>
        <table class="table">
          <thead><tr><th>Medewerker</th><th>Uren</th></tr></thead>
          <tbody>
            ${project.team_stats.map((m) => `<tr><td>${escapeHtml(m.name)}</td><td>${(Number(m.hours) || 0).toFixed(1)}</td></tr>`).join('')}
          </tbody>
        </table>` : ''}

      ${(project.phases && project.phases.length) ? `
        <h2>Fases</h2>
        <table class="table">
          <thead><tr><th>Fase</th><th>Beschrijving</th><th>Uren</th></tr></thead>
          <tbody>
            ${project.phases.map((p) => `<tr><td><strong>${escapeHtml(p.name)}</strong></td><td>${escapeHtml(p.description || '')}</td><td>${(Number(p.hours) || 0).toFixed(1)}</td></tr>`).join('')}
          </tbody>
        </table>` : ''}

      <h2>Uren in de tijd</h2>
      <div class="card-static"><canvas id="hoursOverTime" height="120"></canvas></div>

      <h2>Activiteit</h2>
      <div class="card-static">
        ${(project.activity_log && project.activity_log.length > 0)
          ? `<table class="table" style="margin:0"><thead><tr><th>Wanneer</th><th>Door</th><th>Wat</th></tr></thead><tbody>
              ${[...project.activity_log].reverse().slice(0, 50).map((a) => `
                <tr>
                  <td>${new Date(a.timestamp).toLocaleString('nl-NL')}</td>
                  <td>${escapeHtml(a.user_name)}</td>
                  <td>${escapeHtml(activityDescription(a))}</td>
                </tr>`).join('')}
            </tbody></table>`
          : '<p class="subtle">Nog geen activiteit gelogd.</p>'}
      </div>

      ${canDelete ? `
        <h2 style="margin-top:3rem; color:var(--danger)">Gevaarlijke zone</h2>
        <div class="card-static" style="border-color: rgba(239,68,68,.4)">
          <p class="subtle" style="margin-top:0">Verwijder dit project permanent. Dit verwijdert ook alle uren, notities, PDF en activity log. <strong>Kan niet ongedaan gemaakt worden.</strong></p>
          <button class="btn" id="deleteProjectBtn" style="background:var(--danger); color:#fff">🗑 Verwijder project</button>
        </div>` : ''}
    `;

    document.getElementById('renameBtn').onclick = async () => {
      const newName = prompt('Nieuwe projectnaam:', project.name);
      if (newName === null) return;
      const trimmed = newName.trim();
      if (!trimmed) { toast('Naam mag niet leeg zijn', 'error'); return; }
      if (trimmed === project.name) return;
      try {
        await apiSend(`/api/projects/${encodeURIComponent(id)}`, 'PATCH', { name: trimmed });
        toast('Naam aangepast', 'success');
        await load();
      } catch (err) { toast(err.message, 'error'); }
    };

    if (canDelete) document.getElementById('deleteProjectBtn').onclick = deleteProjectFlow;

    document.getElementById('syncBtn').onclick = async () => {
      try {
        const r = await apiSend(`/api/projects/${encodeURIComponent(id)}/sync`, 'POST');
        toast(`${r.count} entries gesynchroniseerd`, 'success');
        setTimeout(() => location.reload(), 800);
      } catch (err) { toast(err.message, 'error'); }
    };

    document.getElementById('noteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = e.target.elements.text.value.trim();
      if (!text) { toast('Notitie mag niet leeg zijn', 'error'); return; }
      try {
        await apiSend(`/api/projects/${encodeURIComponent(id)}`, 'PATCH', { add_note: { text } });
        toast('Notitie toegevoegd', 'success');
        await load();
      } catch (err) { toast(err.message, 'error'); }
    });
    for (const link of document.querySelectorAll('a[data-delete-note]')) {
      link.onclick = async (ev) => {
        ev.preventDefault();
        if (!confirm('Notitie verwijderen?')) return;
        try {
          await apiSend(`/api/projects/${encodeURIComponent(id)}`, 'PATCH', { delete_note: { id: link.dataset.deleteNote } });
          toast('Notitie verwijderd', 'success');
          await load();
        } catch (err) { toast(err.message, 'error'); }
      };
    }

    document.getElementById('pdfUploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = e.target.querySelector('input[name=pdf]').files[0];
      if (!file) { toast('Selecteer een PDF', 'error'); return; }
      const fd = new FormData();
      fd.append('pdf', file);
      toast('PDF wordt geüpload…', 'info');
      try {
        await apiSend(`/api/projects/parse-pdf?project_id=${encodeURIComponent(id)}`, 'POST', fd, true);
        toast('PDF opgeslagen op project', 'success');
        await load();
      } catch (err) { toast(err.message, 'error'); }
    });

    const teamGrid = document.getElementById('teamGrid');
    apiGet('/api/moneybird/employees').then(({ employees }) => {
      const checkedIds = new Set((project.team || []).map((t) => t.moneybird_user_id));
      if (employees.length === 0) {
        teamGrid.innerHTML = '<span class="subtle">Geen medewerkers gevonden.</span>';
        return;
      }
      teamGrid.innerHTML = employees.map((e) => `
        <label>
          <input type="checkbox" data-emp-id="${e.id}" data-emp-name="${(e.name || '').replace(/"/g, '&quot;')}" ${checkedIds.has(e.id) ? 'checked' : ''}>
          ${escapeHtml(e.name)}
        </label>`).join('');
    }).catch((err) => { teamGrid.innerHTML = `<span class="subtle">Fout: ${err.message}</span>`; });

    function bindContactRow(tr) {
      const removeBtn = tr.querySelector('[data-remove]');
      if (removeBtn) {
        removeBtn.onclick = () => {
          const tbody = document.getElementById('contactsBody');
          if (tbody.children.length > 1) tr.remove();
          else tr.querySelectorAll('input').forEach((i) => { if (i.type === 'checkbox') i.checked = false; else i.value = ''; });
        };
      }
    }
    document.querySelectorAll('#contactsBody tr').forEach(bindContactRow);
    document.getElementById('addContact').onclick = () => {
      const tbody = document.getElementById('contactsBody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" data-contact="name"></td>
        <td><input type="email" data-contact="email"></td>
        <td style="text-align:center"><input type="checkbox" data-contact="receives_threshold_mails" style="width:auto"></td>
        <td><button class="btn btn-ghost" type="button" data-remove>Verwijder</button></td>`;
      tbody.appendChild(tr);
      bindContactRow(tr);
    };

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const team = Array.from(document.querySelectorAll('#teamGrid input[type=checkbox]:checked'))
        .map((cb) => ({ moneybird_user_id: cb.dataset.empId, name: cb.dataset.empName }));
      const contacts = [];
      for (const tr of document.querySelectorAll('#contactsBody tr')) {
        const name = tr.querySelector('[data-contact=name]').value.trim();
        const email = tr.querySelector('[data-contact=email]').value.trim();
        const receives = tr.querySelector('[data-contact=receives_threshold_mails]').checked;
        if (!name && !email) continue;
        contacts.push({ name, email, receives_threshold_mails: receives });
      }
      const modules = Array.from(document.querySelectorAll('#modulesGrid input[type=checkbox]:checked'))
        .map((cb) => cb.value);
      if (modules.length === 0) { toast('Selecteer minstens 1 module', 'error'); return; }
      const body = {
        description: f.get('description'),
        available_hours: Number(f.get('available_hours')) || 0,
        hourly_rate: Number(f.get('hourly_rate')) || 0,
        exceptions: f.get('exceptions'),
        feature_requests: f.get('feature_requests'),
        status: f.get('status'),
        modules,
        deadline: f.get('deadline') || '',
        start_date: f.get('start_date') || '',
        is_poc: f.get('is_poc') === 'on',
        contacts,
        team,
      };
      if (canEditManager) body.manager_id = f.get('manager_id') || null;
      try {
        await apiSend(`/api/projects/${encodeURIComponent(id)}`, 'PATCH', body);
        toast('Opgeslagen', 'success');
        await load();
      } catch (err) { toast(err.message, 'error'); }
    });

    const delPdfBtn = document.getElementById('deletePdfBtn');
    if (delPdfBtn) {
      delPdfBtn.onclick = async () => {
        if (!confirm('Opgeslagen offerte-PDF verwijderen?')) return;
        try {
          await apiSend(`/api/projects/${encodeURIComponent(id)}`, 'PATCH', { delete_pdf: true });
          toast('PDF verwijderd', 'success');
          await load();
        } catch (err) { toast(err.message, 'error'); }
      };
    }

    if (!chartsRendered) {
      chartsRendered = true;
      apiGet(`/api/projects/${encodeURIComponent(id)}/hours?type=over-time`).then((d) => {
        const ctx = document.getElementById('hoursOverTime'); if (!ctx) return;
        const datasets = [
          { label: 'Uren per dag', data: d.daily, backgroundColor: 'rgba(99,102,241,0.4)', borderColor: '#6366f1', type: 'bar' },
          { label: 'Cumulatief', data: d.cumulative, borderColor: '#0ea5e9', backgroundColor: 'rgba(14,165,233,0.1)', fill: true, type: 'line', tension: .3 },
        ];
        if (d.available > 0) datasets.push({ label: 'Beschikbaar (max)', data: d.labels.map(() => d.available), borderColor: '#ef4444', borderDash: [6, 6], pointRadius: 0, type: 'line', fill: false });
        new Chart(ctx, { type: 'bar', data: { labels: d.labels, datasets }, options: { responsive: true, interaction: { mode: 'index' } } });
      });
    }
  }

  await load();
</script>
</body></html>
