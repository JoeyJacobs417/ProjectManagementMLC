<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Planning — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <h1>Planning</h1>
  <p class="subtle">Per medewerker: actieve projecten, resterende uren, vakantie, weekoverzicht en geschatte einddatum.</p>

  <div class="card-static" style="margin-bottom:1rem; padding:.75rem 1rem">
    <label style="display:flex; flex-direction:row; align-items:center; gap:.75rem; margin:0; font-weight:500">
      Filter op medewerker:
      <select id="empFilter" style="width:auto; min-width:240px">
        <option value="all">Alle medewerkers</option>
      </select>
      <span class="subtle" id="filterCount"></span>
    </label>
  </div>

  <div id="content"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, apiSend, renderTopbar, toast, escapeHtml, statusLabel } from '/app.js';
  const me = await renderTopbar('/planning.html');

  // Time entries meeladen voor weekly view
  const [{ projects }, { settings }] = await Promise.all([
    apiGet('/api/projects?with_time_entries=1'),
    apiGet('/api/admin/settings').catch(() => ({ settings: { employee_capacities: {}, employee_vacations: {} } })),
  ]);
  const capacities = settings.employee_capacities || {};
  const vacationsByEmp = settings.employee_vacations || {};
  const isAdmin = me?.role === 'admin';

  // ── Datum-helpers ─────────────────────────────────────────────
  function todayIso() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.toISOString().slice(0, 10);
  }
  function isoToDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function dateToIso(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}-${m}-${y}`;
  }
  function fmtDateShort(iso) {
    if (!iso) return '';
    const months = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
    const [y, m, d] = iso.split('-');
    return `${Number(d)} ${months[Number(m)-1]}`;
  }
  function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }
  function isOnVacation(iso, periods) {
    return (periods || []).some((p) => p.start <= iso && iso <= p.end);
  }
  function mondayOf(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    const dow = d.getDay();
    const diff = dow === 0 ? -6 : 1 - dow; // ma=1
    d.setDate(d.getDate() + diff);
    return d;
  }

  function vacationDaysInRange(periods, startIso, endIso) {
    if (!periods || periods.length === 0) return 0;
    let count = 0;
    for (const p of periods) {
      const s = p.start > startIso ? p.start : startIso;
      const e = p.end < endIso ? p.end : endIso;
      if (s > e) continue;
      let d = isoToDate(s);
      const end = isoToDate(e);
      while (d <= end) {
        if (!isWeekend(d)) count++;
        d.setDate(d.getDate() + 1);
      }
    }
    return count;
  }

  function estimateCompletionDate(remainingHours, capacityPerWeek, periods) {
    if (!capacityPerWeek || capacityPerWeek <= 0) return null;
    const dailyHours = capacityPerWeek / 5;
    const workDaysNeeded = Math.ceil(remainingHours / dailyHours);
    if (workDaysNeeded === 0) return new Date();
    let d = new Date();
    d.setHours(0, 0, 0, 0);
    let worked = 0;
    let safety = 365 * 5;
    while (worked < workDaysNeeded && safety-- > 0) {
      const iso = dateToIso(d);
      if (!isWeekend(d) && !isOnVacation(iso, periods)) {
        worked++;
        if (worked >= workDaysNeeded) return new Date(d);
      }
      d.setDate(d.getDate() + 1);
    }
    return null;
  }

  // ── Groepeer projecten per medewerker ─────────────────────────
  const byEmp = new Map();
  for (const p of projects) {
    if (p.status === 'done') continue;
    for (const t of (p.team || [])) {
      const key = t.moneybird_user_id;
      if (!byEmp.has(key)) {
        byEmp.set(key, { id: key, name: t.name, rows: [], totalOwn: 0, totalRemaining: 0, newCount: 0 });
      }
      const rec = byEmp.get(key);
      const stat = (p.team_stats || []).find((s) => s.moneybird_user_id === key);
      const ownHours = stat ? Number(stat.hours) || 0 : 0;
      const remaining = Math.max(0, (Number(p.available_hours) || 0) - (Number(p.hours_used) || 0));
      rec.rows.push({ project: p, ownHours, remaining });
      rec.totalOwn += ownHours;
      rec.totalRemaining += remaining;
      if (p.status === 'future') rec.newCount += 1;
    }
  }
  const employees = Array.from(byEmp.values()).sort((a, b) => b.totalRemaining - a.totalRemaining);

  // ── Filter dropdown vullen ────────────────────────────────────
  const empFilter = document.getElementById('empFilter');
  for (const e of employees) {
    const o = document.createElement('option');
    o.value = e.id; o.textContent = e.name;
    empFilter.appendChild(o);
  }
  const STORAGE_KEY = 'pm_planning_emp_filter';
  empFilter.value = sessionStorage.getItem(STORAGE_KEY) || 'all';

  // ── Weekly hours per medewerker ────────────────────────────────
  // Voor laatste N weken: per (empId, weekStartIso, projectId) -> hours
  const WEEKS_BACK = 4;
  function buildWeeklyForEmployee(empId) {
    // verzamel time entries van deze persoon, gegroepeerd per (weekStart, projectId)
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const thisMonday = mondayOf(today);
    const weekStarts = [];
    for (let i = WEEKS_BACK - 1; i >= 0; i--) {
      const d = new Date(thisMonday);
      d.setDate(d.getDate() - 7 * i);
      weekStarts.push(dateToIso(d));
    }
    // map: weekIso -> Map<projectId, hours>
    const weekMap = new Map(weekStarts.map((w) => [w, new Map()]));
    for (const p of projects) {
      const entries = p.time_entries || [];
      for (const e of entries) {
        if (e.user_moneybird_id !== empId || !e.started_at) continue;
        const entryDate = new Date(String(e.started_at).slice(0, 10));
        const monday = dateToIso(mondayOf(entryDate));
        if (!weekMap.has(monday)) continue;
        const projMap = weekMap.get(monday);
        projMap.set(p.id, (projMap.get(p.id) || 0) + (Number(e.hours) || 0));
      }
    }
    return weekStarts.map((w) => ({
      weekStart: w,
      perProject: Array.from(weekMap.get(w).entries())
        .map(([pid, hours]) => {
          const pr = projects.find((x) => x.id === pid);
          return { project_id: pid, project_name: pr ? pr.name : 'Onbekend', hours };
        })
        .sort((a, b) => b.hours - a.hours),
      total: Array.from(weekMap.get(w).values()).reduce((a, h) => a + h, 0),
    }));
  }

  // ── Render ────────────────────────────────────────────────────
  function render() {
    const value = empFilter.value;
    sessionStorage.setItem(STORAGE_KEY, value);
    const shown = value === 'all' ? employees : employees.filter((e) => e.id === value);

    document.getElementById('filterCount').textContent =
      `${shown.length} van ${employees.length} medewerker${employees.length === 1 ? '' : 's'}`;

    const c = document.getElementById('content');
    if (shown.length === 0) {
      c.innerHTML = `<p class="subtle">Geen medewerkers gevonden voor deze filter.</p>`;
      return;
    }

    const today = todayIso();
    c.innerHTML = shown.map((e) => {
      const order = { in_progress: 0, future: 1, on_hold: 2 };
      const rows = [...e.rows].sort((a, b) => (order[a.project.status] ?? 9) - (order[b.project.status] ?? 9));
      const cap = Number(capacities[e.id]) || 0;
      const periods = vacationsByEmp[e.id] || [];
      const upcoming = periods.filter((p) => p.end >= today);

      let estimateHtml = '<span class="subtle">capaciteit niet ingesteld</span>';
      if (cap > 0 && e.totalRemaining > 0) {
        const completion = estimateCompletionDate(e.totalRemaining, cap, upcoming);
        const baseWeeks = (e.totalRemaining / cap).toFixed(1);
        if (completion) {
          const completionIso = dateToIso(completion);
          const vacationDays = vacationDaysInRange(upcoming, today, completionIso);
          estimateHtml = `${baseWeeks} weken werk · verwacht klaar <strong>${fmtDate(completionIso)}</strong>${vacationDays > 0 ? ` (incl. ${vacationDays} ${vacationDays === 1 ? 'vakantiedag' : 'vakantiedagen'})` : ''}`;
        } else {
          estimateHtml = `${baseWeeks} weken werk`;
        }
      } else if (e.totalRemaining === 0) {
        estimateHtml = '<span class="subtle">niets meer te doen</span>';
      }

      const vacationListHtml = upcoming.length === 0
        ? '<span class="subtle">geen geplande vakantie</span>'
        : upcoming.map((p, i) => `
            <span class="badge badge-orange" style="margin-right:.35rem; display:inline-block; margin-bottom:.25rem">
              ${fmtDate(p.start)} t/m ${fmtDate(p.end)}${p.label ? ' — ' + escapeHtml(p.label) : ''}
              ${isAdmin ? `<a href="#" data-remove-vac="${e.id}|${i}" style="margin-left:.5rem; color:inherit; text-decoration:none">×</a>` : ''}
            </span>`).join('');

      // Weekly breakdown
      const weeks = buildWeeklyForEmployee(e.id);
      const weeklyHtml = `
        <h4 style="margin-top:1rem">Wekelijkse breakdown (laatste ${WEEKS_BACK} weken)</h4>
        <table class="table" style="margin:0">
          <thead><tr>
            <th>Week (ma)</th>
            <th>Projecten waar uren geschreven zijn</th>
            <th>Totaal</th>
            <th>vs. capaciteit</th>
          </tr></thead>
          <tbody>
            ${weeks.map((w) => {
              const dist = w.perProject.length === 0
                ? '<span class="subtle">geen uren</span>'
                : w.perProject.map((pp) => `<span class="badge badge-gray" style="margin-right:.25rem">${escapeHtml(pp.project_name)}: ${pp.hours.toFixed(1)}u</span>`).join('');
              const capCmp = cap > 0
                ? `<span class="badge ${w.total >= cap ? 'badge-green' : w.total >= cap * 0.6 ? 'badge-orange' : 'badge-red'}">${w.total.toFixed(1)} / ${cap}u</span>`
                : '<span class="subtle">—</span>';
              return `
                <tr>
                  <td>${fmtDateShort(w.weekStart)}</td>
                  <td>${dist}</td>
                  <td><strong>${w.total.toFixed(1)}u</strong></td>
                  <td>${capCmp}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;

      return `
        <div class="card-static" style="margin-bottom:1.25rem" data-emp-id="${e.id}">
          <div class="card-header" style="margin-bottom:.75rem">
            <h2 style="margin:0">${escapeHtml(e.name)}</h2>
            <div class="subtle" style="text-align:right">
              <div>Werkt aan <strong>${e.rows.length}</strong> ${e.rows.length === 1 ? 'project' : 'projecten'}</div>
              <div><strong>${e.totalRemaining.toFixed(1)}</strong> uur budget resterend</div>
              <div>Capaciteit: <strong>${cap > 0 ? cap + ' uur/week' : '—'}</strong></div>
              <div>${estimateHtml}</div>
              ${e.newCount > 0 ? `<div><span class="badge status-future">${e.newCount} nieuwe ${e.newCount === 1 ? 'toewijzing' : 'toewijzingen'}</span></div>` : ''}
            </div>
          </div>

          <div style="margin-bottom:.75rem">
            <div class="subtle" style="font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom:.35rem">Vakantie</div>
            <div>${vacationListHtml}</div>
            ${isAdmin ? `
              <div style="margin-top:.5rem; display:flex; flex-wrap:wrap; gap:.5rem; align-items:flex-end">
                <label style="margin:0; flex:0 0 auto">
                  <span class="subtle" style="font-size:.75rem">Van</span>
                  <input type="date" data-vac-start="${e.id}" style="width:auto">
                </label>
                <label style="margin:0; flex:0 0 auto">
                  <span class="subtle" style="font-size:.75rem">Tot</span>
                  <input type="date" data-vac-end="${e.id}" style="width:auto">
                </label>
                <label style="margin:0; flex:1 1 200px">
                  <span class="subtle" style="font-size:.75rem">Label (optioneel)</span>
                  <input type="text" data-vac-label="${e.id}" placeholder="bv. zomervakantie">
                </label>
                <button class="btn btn-ghost" type="button" data-add-vac="${e.id}">+ Vakantie toevoegen</button>
              </div>` : ''}
          </div>

          <h4 style="margin-top:1rem">Toegewezen projecten</h4>
          <table class="table" style="margin:0">
            <thead><tr>
              <th>Project</th>
              <th>Module</th>
              <th>Status</th>
              <th>Uren door ${escapeHtml(e.name)}</th>
              <th>Resterend</th>
              <th>Totaal</th>
            </tr></thead>
            <tbody>
              ${rows.map((row) => {
                const p = row.project;
                return `
                  <tr class="clickable" data-id="${encodeURIComponent(p.id)}">
                    <td><strong>${escapeHtml(p.name)}</strong>${p.is_poc ? ' <span class="badge" style="background:rgba(139,92,246,.15);color:#6d28d9">POC</span>' : ''}</td>
                    <td>${p.module ? `<span class="badge badge-blue">${escapeHtml(p.module)}</span>` : '<span class="subtle">—</span>'}</td>
                    <td><span class="badge status-${p.status}">${statusLabel(p.status)}</span></td>
                    <td>${row.ownHours.toFixed(1)} u</td>
                    <td>${row.remaining.toFixed(1)} u</td>
                    <td>${(Number(p.available_hours) || 0).toFixed(1)} u</td>
                  </tr>`;
              }).join('')}
            </tbody>
          </table>

          ${weeklyHtml}
        </div>`;
    }).join('');

    for (const tr of c.querySelectorAll('tr.clickable')) {
      tr.onclick = () => location.href = `/project.html?id=${tr.dataset.id}`;
    }

    for (const btn of c.querySelectorAll('button[data-add-vac]')) {
      btn.onclick = async () => {
        const empId = btn.dataset.addVac;
        const start = document.querySelector(`input[data-vac-start="${empId}"]`).value;
        const end = document.querySelector(`input[data-vac-end="${empId}"]`).value;
        const label = document.querySelector(`input[data-vac-label="${empId}"]`).value.trim();
        if (!start || !end) { toast('Vul een start- en einddatum in', 'error'); return; }
        if (start > end) { toast('Einddatum moet na startdatum liggen', 'error'); return; }
        await saveVacations(empId, [...(vacationsByEmp[empId] || []), { start, end, label }]);
      };
    }

    for (const link of c.querySelectorAll('a[data-remove-vac]')) {
      link.onclick = async (ev) => {
        ev.preventDefault();
        const [empId, idx] = link.dataset.removeVac.split('|');
        const cur = vacationsByEmp[empId] || [];
        const next = cur.filter((_, i) => i !== Number(idx));
        await saveVacations(empId, next);
      };
    }
  }

  async function saveVacations(empId, list) {
    const next = { ...vacationsByEmp, [empId]: list };
    if (list.length === 0) delete next[empId];
    try {
      await apiSend('/api/admin/settings', 'POST', { employee_vacations: next });
      Object.assign(vacationsByEmp, next);
      for (const k of Object.keys(vacationsByEmp)) {
        if (!(k in next)) delete vacationsByEmp[k];
      }
      toast('Vakantie opgeslagen', 'success');
      render();
    } catch (err) { toast(err.message, 'error'); }
  }

  empFilter.addEventListener('change', render);

  if (employees.length === 0) {
    document.getElementById('content').innerHTML =
      `<p class="subtle">Er zijn nog geen medewerkers toegewezen aan projecten. Wijs medewerkers toe via de project-detail pagina.</p>`;
  } else {
    render();
  }
</script>
</body></html>
