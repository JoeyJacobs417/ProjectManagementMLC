<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Planning — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <div class="page-header">
    <h1>Planning</h1>
    <div style="display:flex; gap:.5rem">
      <button class="btn btn-ghost" id="refreshBtn" title="Vernieuw Moneybird-uren (omzeilt cache)">↻ Vernieuw</button>
      <button class="btn btn-ghost" id="exportBtn">⬇ Export Excel</button>
    </div>
  </div>
  <p class="subtle">Per medewerker: toegewezen projecten (In progress / On hold / Future), vakantie, weekoverzicht en geschatte einddatum.</p>

  <div class="card-static" style="margin-bottom:1rem; padding:.75rem 1rem">
    <label style="display:flex; flex-direction:row; align-items:center; gap:.75rem; margin:0; font-weight:500">
      Filter op medewerker:
      <select id="empFilter" style="width:auto; min-width:240px">
        <option value="all">Alle medewerkers</option>
      </select>
      <span class="subtle" id="filterCount"></span>
      <span class="subtle" id="cacheStatus" style="margin-left:auto"></span>
    </label>
  </div>

  <div id="content"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, apiSend, renderTopbar, toast, escapeHtml, statusLabel } from '/app.js';
  const me = await renderTopbar('/planning.html');

  const PLANNING_STATUSES = new Set(['in_progress', 'on_hold', 'future']);
  const WEEKS_BACK = 4;

  // ── Datum-helpers ─────────────────────────────────────────────
  function todayIso() { const d = new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
  function isoToDate(iso) { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
  function dateToIso(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function fmtDate(iso) { if (!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`; }
  function fmtDateShort(iso) {
    if (!iso) return '';
    const months = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
    const [y, m, d] = iso.split('-');
    return `${Number(d)} ${months[Number(m)-1]}`;
  }
  function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }
  function isOnVacation(iso, periods) { return (periods || []).some((p) => p.start <= iso && iso <= p.end); }
  function mondayOf(date) {
    const d = new Date(date); d.setHours(0, 0, 0, 0);
    const dow = d.getDay();
    const diff = dow === 0 ? -6 : 1 - dow;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function vacationDaysInRange(periods, startIso, endIso) {
    if (!periods || periods.length === 0) return 0;
    let count = 0;
    for (const p of periods) {
      const s = p.start > startIso ? p.start : startIso;
      const e = p.end < endIso ? p.end : endIso;
      if (s > e) continue;
      let d = isoToDate(s); const end = isoToDate(e);
      while (d <= end) { if (!isWeekend(d)) count++; d.setDate(d.getDate() + 1); }
    }
    return count;
  }
  function estimateCompletionDate(remainingHours, capacityPerWeek, periods) {
    if (!capacityPerWeek || capacityPerWeek <= 0) return null;
    const dailyHours = capacityPerWeek / 5;
    const workDaysNeeded = Math.ceil(remainingHours / dailyHours);
    if (workDaysNeeded === 0) return new Date();
    let d = new Date(); d.setHours(0, 0, 0, 0);
    let worked = 0; let safety = 365 * 5;
    while (worked < workDaysNeeded && safety-- > 0) {
      const iso = dateToIso(d);
      if (!isWeekend(d) && !isOnVacation(iso, periods)) {
        worked++;
        if (worked >= workDaysNeeded) return new Date(d);
      }
      d.setDate(d.getDate() + 1);
    }
    return null;
  }

  // ── Data laden ────────────────────────────────────────────────
  let projects = [], capacities = {}, vacationsByEmp = {}, allMoneybirdEntries = [];
  let trackedMoneybirdIds = new Set();
  let mbCacheStatus = '';

  // Cutoff voor "laatste 4 weken" sectie
  function fourWeeksAgoIso() {
    const d = new Date(); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - WEEKS_BACK * 7);
    return dateToIso(d);
  }

  async function loadAllData(refresh = false) {
    document.getElementById('content').innerHTML = '<p class="subtle">Laden…</p>';
    document.getElementById('cacheStatus').textContent = '';

    const sinceDate = new Date();
    sinceDate.setDate(sinceDate.getDate() - (WEEKS_BACK + 1) * 7);
    const sinceIso = sinceDate.toISOString().slice(0, 10);

    const mbUrl = `/api/moneybird/time_entries?since=${sinceIso}${refresh ? '&nocache=1' : ''}`;
    const [projResp, settingsResp, mbResp] = await Promise.all([
      apiGet('/api/projects?with_time_entries=1'),
      apiGet('/api/admin/settings').catch(() => ({ settings: { employee_capacities: {}, employee_vacations: {} } })),
      fetch(mbUrl, { credentials: 'same-origin' }).then(async (r) => {
        mbCacheStatus = r.headers.get('X-Cache') || '';
        return r.json().catch(() => ({ time_entries: [] }));
      }).catch(() => ({ time_entries: [] })),
    ]);

    projects = projResp.projects;
    capacities = settingsResp.settings.employee_capacities || {};
    vacationsByEmp = settingsResp.settings.employee_vacations || {};
    allMoneybirdEntries = mbResp.time_entries || [];
    trackedMoneybirdIds = new Set(
      projects.map((p) => p.moneybird_project_id).filter(Boolean).map(String)
    );

    if (mbCacheStatus === 'HIT') document.getElementById('cacheStatus').textContent = '✓ Moneybird uit cache';
    else if (mbCacheStatus === 'MISS') document.getElementById('cacheStatus').textContent = '✓ Moneybird fresh fetch';

    rebuildEmployees();
    render();
  }

  document.getElementById('refreshBtn').onclick = async () => {
    toast('Moneybird-uren vernieuwen…', 'info');
    await loadAllData(true);
    toast('Vernieuwd', 'success');
  };

  let employees = [];
  const isAdmin = me?.role === 'admin';
  const STORAGE_KEY = 'pm_planning_emp_filter';

  function rebuildEmployees() {
    const byEmp = new Map();
    for (const p of projects) {
      if (!PLANNING_STATUSES.has(p.status)) continue;
      for (const t of (p.team || [])) {
        const key = t.moneybird_user_id;
        if (!byEmp.has(key)) {
          byEmp.set(key, { id: key, name: t.name, rows: [], totalOwn: 0, totalRemaining: 0, newCount: 0 });
        }
        const rec = byEmp.get(key);
        const stat = (p.team_stats || []).find((s) => s.moneybird_user_id === key);
        const ownHours = stat ? Number(stat.hours) || 0 : 0;
        const remaining = Math.max(0, (Number(p.available_hours) || 0) - (Number(p.hours_used) || 0));
        rec.rows.push({ project: p, ownHours, remaining });
        rec.totalOwn += ownHours;
        rec.totalRemaining += remaining;
        if (p.status === 'future') rec.newCount += 1;
      }
    }
    employees = Array.from(byEmp.values()).sort((a, b) => b.totalRemaining - a.totalRemaining);

    const empFilter = document.getElementById('empFilter');
    const cur = empFilter.value || sessionStorage.getItem(STORAGE_KEY) || 'all';
    empFilter.innerHTML = '<option value="all">Alle medewerkers</option>' +
      employees.map((e) => `<option value="${escapeHtml(e.id)}">${escapeHtml(e.name)}</option>`).join('');
    empFilter.value = cur;
  }

  function buildWeeklyForEmployee(empId) {
    const today = new Date(); today.setHours(0,0,0,0);
    const thisMonday = mondayOf(today);
    const weekStarts = [];
    for (let i = WEEKS_BACK - 1; i >= 0; i--) {
      const d = new Date(thisMonday);
      d.setDate(d.getDate() - 7 * i);
      weekStarts.push(dateToIso(d));
    }
    const weekMap = new Map(weekStarts.map((w) => [w, { perTracked: new Map(), other: new Map(), otherTotal: 0 }]));

    for (const p of projects) {
      for (const e of (p.time_entries || [])) {
        if (e.user_moneybird_id !== empId || !e.started_at) continue;
        const monday = dateToIso(mondayOf(new Date(String(e.started_at).slice(0,10))));
        if (!weekMap.has(monday)) continue;
        const cur = weekMap.get(monday).perTracked;
        cur.set(p.id, (cur.get(p.id) || 0) + (Number(e.hours) || 0));
      }
    }
    for (const e of allMoneybirdEntries) {
      if (e.user_moneybird_id !== empId || !e.started_at) continue;
      if (e.moneybird_project_id && trackedMoneybirdIds.has(String(e.moneybird_project_id))) continue;
      const monday = dateToIso(mondayOf(new Date(String(e.started_at).slice(0,10))));
      if (!weekMap.has(monday)) continue;
      const bucket = weekMap.get(monday).other;
      const mbName = e.moneybird_project_name || '(geen project)';
      bucket.set(mbName, (bucket.get(mbName) || 0) + (Number(e.hours) || 0));
      weekMap.get(monday).otherTotal += (Number(e.hours) || 0);
    }

    return weekStarts.map((w) => {
      const wd = weekMap.get(w);
      return {
        weekStart: w,
        perProject: Array.from(wd.perTracked.entries())
          .map(([pid, hours]) => {
            const pr = projects.find((x) => x.id === pid);
            return { project_id: pid, project_name: pr ? pr.name : 'Onbekend', hours };
          })
          .sort((a, b) => b.hours - a.hours),
        otherDist: Array.from(wd.other.entries())
          .map(([name, hours]) => ({ project_name: name, hours }))
          .sort((a, b) => b.hours - a.hours),
        otherTotal: wd.otherTotal,
        total: Array.from(wd.perTracked.values()).reduce((a, h) => a + h, 0) + wd.otherTotal,
      };
    });
  }

  // Alle Moneybird-projecten met uren in laatste 4 weken (tracked + untracked)
  function moneybirdSummaryForEmployee(empId) {
    const cutoff = fourWeeksAgoIso();
    const map = new Map();
    for (const e of allMoneybirdEntries) {
      if (e.user_moneybird_id !== empId || !e.started_at) continue;
      if (String(e.started_at).slice(0, 10) < cutoff) continue;
      const pid = e.moneybird_project_id ? String(e.moneybird_project_id) : 'no-project';
      const name = e.moneybird_project_name || '(geen project)';
      const tracked = pid !== 'no-project' && trackedMoneybirdIds.has(pid);
      if (!map.has(pid)) map.set(pid, { id: pid, name, hours: 0, tracked });
      map.get(pid).hours += Number(e.hours) || 0;
    }
    return Array.from(map.values()).sort((a, b) => b.hours - a.hours);
  }

  function render() {
    const empFilter = document.getElementById('empFilter');
    const value = empFilter.value;
    sessionStorage.setItem(STORAGE_KEY, value);
    const shown = value === 'all' ? employees : employees.filter((e) => e.id === value);

    document.getElementById('filterCount').textContent =
      `${shown.length} van ${employees.length} medewerker${employees.length === 1 ? '' : 's'}`;

    const c = document.getElementById('content');
    if (employees.length === 0) {
      c.innerHTML = `<p class="subtle">Geen actieve medewerkers met toegewezen projecten in status "In progress", "Future" of "On hold".</p>`;
      return;
    }
    if (shown.length === 0) {
      c.innerHTML = `<p class="subtle">Geen medewerkers gevonden voor deze filter.</p>`;
      return;
    }

    const today = todayIso();
    c.innerHTML = shown.map((e) => {
      const order = { in_progress: 0, future: 1, on_hold: 2 };
      const rows = [...e.rows].sort((a, b) => (order[a.project.status] ?? 9) - (order[b.project.status] ?? 9));
      const cap = Number(capacities[e.id]) || 0;
      const periods = vacationsByEmp[e.id] || [];
      const upcoming = periods.filter((p) => p.end >= today);

      let estimateHtml = '<span class="subtle">capaciteit niet ingesteld</span>';
      if (cap > 0 && e.totalRemaining > 0) {
        const completion = estimateCompletionDate(e.totalRemaining, cap, upcoming);
        const baseWeeks = (e.totalRemaining / cap).toFixed(1);
        if (completion) {
          const completionIso = dateToIso(completion);
          const vacationDays = vacationDaysInRange(upcoming, today, completionIso);
          estimateHtml = `${baseWeeks} weken werk · verwacht klaar <strong>${fmtDate(completionIso)}</strong>${vacationDays > 0 ? ` (incl. ${vacationDays} ${vacationDays === 1 ? 'vakantiedag' : 'vakantiedagen'})` : ''}`;
        } else { estimateHtml = `${baseWeeks} weken werk`; }
      } else if (e.totalRemaining === 0) {
        estimateHtml = '<span class="subtle">niets meer te doen</span>';
      }

      const vacationListHtml = upcoming.length === 0
        ? '<span class="subtle">geen geplande vakantie</span>'
        : upcoming.map((p, i) => `
            <span class="badge badge-orange" style="margin-right:.35rem; display:inline-block; margin-bottom:.25rem">
              ${fmtDate(p.start)} t/m ${fmtDate(p.end)}${p.label ? ' — ' + escapeHtml(p.label) : ''}
              ${isAdmin ? `<a href="#" data-remove-vac="${e.id}|${i}" style="margin-left:.5rem; color:inherit; text-decoration:none">×</a>` : ''}
            </span>`).join('');

      const weeks = buildWeeklyForEmployee(e.id);
      const weeklyRows = weeks.map((w, wIdx) => {
        const dist = w.perProject.length === 0
          ? '<span class="subtle">geen uren</span>'
          : w.perProject.map((pp) => `<span class="badge badge-gray" style="margin-right:.25rem; display:inline-block; margin-bottom:.2rem">${escapeHtml(pp.project_name)}: ${pp.hours.toFixed(1)}u</span>`).join('');
        const overigBadge = w.otherTotal > 0
          ? `<a href="#" class="badge" style="background:rgba(139,92,246,.12);color:#6d28d9;text-decoration:none;cursor:pointer" data-toggle-overig="${e.id}|${wIdx}">Overig: ${w.otherTotal.toFixed(1)}u ▾</a>`
          : '';
        const overigPanel = w.otherTotal > 0
          ? `<tr class="hidden" data-overig-panel="${e.id}|${wIdx}">
              <td colspan="4" style="background:var(--bg-soft); padding:.75rem 1rem">
                <strong>Overig — uren in Moneybird die niet op een toegewezen project zijn geschreven:</strong>
                <ul style="margin:.4rem 0 0; padding-left:1.2rem">
                  ${w.otherDist.map((od) => `<li>${escapeHtml(od.project_name)}: <strong>${od.hours.toFixed(1)}u</strong></li>`).join('')}
                </ul>
              </td>
            </tr>`
          : '';
        const capCmp = cap > 0
          ? `<span class="badge ${w.total >= cap ? 'badge-green' : w.total >= cap * 0.6 ? 'badge-orange' : 'badge-red'}">${w.total.toFixed(1)} / ${cap}u</span>`
          : '<span class="subtle">—</span>';
        return `
          <tr>
            <td>${fmtDateShort(w.weekStart)}</td>
            <td>${dist}${overigBadge ? ' ' + overigBadge : ''}</td>
            <td><strong>${w.total.toFixed(1)}u</strong></td>
            <td>${capCmp}</td>
          </tr>
          ${overigPanel}`;
      }).join('');

      // Alle Moneybird-projecten in laatste 4 weken (tracked + untracked)
      const mbSummary = moneybirdSummaryForEmployee(e.id);
      const mbSummaryTotal = mbSummary.reduce((a, x) => a + x.hours, 0);
      const mbSummaryHtml = mbSummary.length === 0
        ? '<p class="subtle">Geen uren geschreven in Moneybird in de laatste 4 weken.</p>'
        : `<table class="table" style="margin:0">
            <thead><tr>
              <th>Moneybird-project</th>
              <th>Status</th>
              <th>Uren laatste 4 weken</th>
            </tr></thead>
            <tbody>
              ${mbSummary.map((r) => `
                <tr>
                  <td><strong>${escapeHtml(r.name)}</strong></td>
                  <td>${r.tracked
                    ? '<span class="badge badge-green">gekoppeld in app</span>'
                    : '<span class="badge badge-gray">niet gekoppeld</span>'}</td>
                  <td>${r.hours.toFixed(1)} u</td>
                </tr>`).join('')}
              <tr style="background:var(--bg-soft)">
                <td colspan="2"><strong>Totaal</strong></td>
                <td><strong>${mbSummaryTotal.toFixed(1)} u</strong></td>
              </tr>
            </tbody>
          </table>`;

      return `
        <div class="card-static" style="margin-bottom:1.25rem" data-emp-id="${e.id}">
          <div class="card-header" style="margin-bottom:.75rem">
            <h2 style="margin:0">${escapeHtml(e.name)}</h2>
            <div class="subtle" style="text-align:right">
              <div>Werkt aan <strong>${e.rows.length}</strong> ${e.rows.length === 1 ? 'project' : 'projecten'}</div>
              <div><strong>${e.totalRemaining.toFixed(1)}</strong> uur budget resterend</div>
              <div>Capaciteit: <strong>${cap > 0 ? cap + ' uur/week' : '—'}</strong></div>
              <div>${estimateHtml}</div>
              ${e.newCount > 0 ? `<div><span class="badge status-future">${e.newCount} nieuwe ${e.newCount === 1 ? 'toewijzing' : 'toewijzingen'}</span></div>` : ''}
            </div>
          </div>

          <div style="margin-bottom:.75rem">
            <div class="subtle" style="font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom:.35rem">Vakantie</div>
            <div>${vacationListHtml}</div>
            ${isAdmin ? `
              <div style="margin-top:.5rem; display:flex; flex-wrap:wrap; gap:.5rem; align-items:flex-end">
                <label style="margin:0; flex:0 0 auto"><span class="subtle" style="font-size:.75rem">Van</span><input type="date" data-vac-start="${e.id}" style="width:auto"></label>
                <label style="margin:0; flex:0 0 auto"><span class="subtle" style="font-size:.75rem">Tot</span><input type="date" data-vac-end="${e.id}" style="width:auto"></label>
                <label style="margin:0; flex:1 1 200px"><span class="subtle" style="font-size:.75rem">Label (optioneel)</span><input type="text" data-vac-label="${e.id}" placeholder="bv. zomervakantie"></label>
                <button class="btn btn-ghost" type="button" data-add-vac="${e.id}">+ Vakantie toevoegen</button>
              </div>` : ''}
          </div>

          <h4 style="margin-top:1rem">Toegewezen projecten (In progress / Future / On hold)</h4>
          <table class="table" style="margin:0">
            <thead><tr>
              <th>Project</th><th>Module</th><th>Status</th>
              <th>Uren door ${escapeHtml(e.name)}</th><th>Resterend</th><th>Totaal</th>
            </tr></thead>
            <tbody>
              ${rows.map((row) => {
                const p = row.project;
                return `
                  <tr class="clickable" data-id="${encodeURIComponent(p.id)}">
                    <td><strong>${escapeHtml(p.name)}</strong>${p.is_poc ? ' <span class="badge" style="background:rgba(139,92,246,.15);color:#6d28d9">POC</span>' : ''}</td>
                    <td>${p.module ? `<span class="badge badge-blue">${escapeHtml(p.module)}</span>` : '<span class="subtle">—</span>'}</td>
                    <td><span class="badge status-${p.status}">${statusLabel(p.status)}</span></td>
                    <td>${row.ownHours.toFixed(1)} u</td>
                    <td>${row.remaining.toFixed(1)} u</td>
                    <td>${(Number(p.available_hours) || 0).toFixed(1)} u</td>
                  </tr>`;
              }).join('')}
            </tbody>
          </table>

          <h4 style="margin-top:1rem">Wekelijkse breakdown (laatste ${WEEKS_BACK} weken)</h4>
          <table class="table" style="margin:0">
            <thead><tr>
              <th>Week (ma)</th><th>Projecten</th><th>Totaal</th><th>vs. capaciteit</th>
            </tr></thead>
            <tbody>${weeklyRows}</tbody>
          </table>

          <h4 style="margin-top:1rem">Alle Moneybird-projecten (laatste ${WEEKS_BACK} weken)</h4>
          <p class="subtle" style="margin-top:-.4rem; font-size:.85rem">Toont alle projecten waar deze persoon uren op heeft geschreven in Moneybird, ook als ze niet in deze app gekoppeld zijn.</p>
          ${mbSummaryHtml}
        </div>`;
    }).join('');

    for (const tr of c.querySelectorAll('tr.clickable')) {
      tr.onclick = () => location.href = `/project.html?id=${tr.dataset.id}`;
    }
    for (const link of c.querySelectorAll('a[data-toggle-overig]')) {
      link.onclick = (ev) => {
        ev.preventDefault();
        const panel = c.querySelector(`tr[data-overig-panel="${link.dataset.toggleOverig}"]`);
        if (panel) panel.classList.toggle('hidden');
      };
    }
    for (const btn of c.querySelectorAll('button[data-add-vac]')) {
      btn.onclick = async () => {
        const empId = btn.dataset.addVac;
        const start = document.querySelector(`input[data-vac-start="${empId}"]`).value;
        const end = document.querySelector(`input[data-vac-end="${empId}"]`).value;
        const label = document.querySelector(`input[data-vac-label="${empId}"]`).value.trim();
        if (!start || !end) { toast('Vul een start- en einddatum in', 'error'); return; }
        if (start > end) { toast('Einddatum moet na startdatum liggen', 'error'); return; }
        await saveVacations(empId, [...(vacationsByEmp[empId] || []), { start, end, label }]);
      };
    }
    for (const link of c.querySelectorAll('a[data-remove-vac]')) {
      link.onclick = async (ev) => {
        ev.preventDefault();
        const [empId, idx] = link.dataset.removeVac.split('|');
        const cur = vacationsByEmp[empId] || [];
        await saveVacations(empId, cur.filter((_, i) => i !== Number(idx)));
      };
    }
  }

  async function saveVacations(empId, list) {
    const next = { ...vacationsByEmp, [empId]: list };
    if (list.length === 0) delete next[empId];
    try {
      await apiSend('/api/admin/settings', 'POST', { employee_vacations: next });
      Object.assign(vacationsByEmp, next);
      for (const k of Object.keys(vacationsByEmp)) { if (!(k in next)) delete vacationsByEmp[k]; }
      toast('Vakantie opgeslagen', 'success');
      render();
    } catch (err) { toast(err.message, 'error'); }
  }

  document.getElementById('empFilter').addEventListener('change', render);

  // ── Excel export ──────────────────────────────────────────────
  document.getElementById('exportBtn').onclick = () => {
    if (typeof XLSX === 'undefined') { toast('Excel-library niet geladen', 'error'); return; }
    const wb = XLSX.utils.book_new();
    const sumRows = employees.map((e) => {
      const cap = Number(capacities[e.id]) || 0;
      const periods = vacationsByEmp[e.id] || [];
      const upcoming = periods.filter((p) => p.end >= todayIso());
      let estCompletion = '';
      if (cap > 0 && e.totalRemaining > 0) {
        const cd = estimateCompletionDate(e.totalRemaining, cap, upcoming);
        if (cd) estCompletion = dateToIso(cd);
      }
      return {
        'Medewerker': e.name, 'Aantal projecten': e.rows.length,
        'Uren resterend totaal': Math.round(e.totalRemaining * 10) / 10,
        'Capaciteit (u/wk)': cap || '', 'Verwacht klaar': estCompletion,
        'Geplande vakantie': upcoming.map((p) => `${p.start} t/m ${p.end}${p.label ? ' (' + p.label + ')' : ''}`).join('; '),
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sumRows), 'Per medewerker');

    const assignRows = [];
    for (const e of employees) {
      for (const r of e.rows) {
        const p = r.project;
        assignRows.push({
          'Medewerker': e.name, 'Project': p.name, 'Module': p.module || '',
          'Status': statusLabel(p.status), 'POC': p.is_poc ? 'Ja' : '',
          'Deadline': p.deadline || '',
          'Uren door persoon': Math.round(r.ownHours * 10) / 10,
          'Resterend op project': Math.round(r.remaining * 10) / 10,
          'Totaal beschikbaar': Number(p.available_hours) || 0,
        });
      }
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assignRows), 'Toewijzingen');

    const weeklyRows = [];
    for (const e of employees) {
      const weeks = buildWeeklyForEmployee(e.id);
      for (const w of weeks) {
        for (const pp of w.perProject) {
          weeklyRows.push({ 'Medewerker': e.name, 'Week (ma)': w.weekStart, 'Project': pp.project_name, 'Bron': 'toegewezen', 'Uren': Math.round(pp.hours * 10) / 10 });
        }
        for (const od of w.otherDist) {
          weeklyRows.push({ 'Medewerker': e.name, 'Week (ma)': w.weekStart, 'Project': od.project_name, 'Bron': 'overig (Moneybird)', 'Uren': Math.round(od.hours * 10) / 10 });
        }
      }
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(weeklyRows), 'Weekly');

    // Nieuwe sheet: alle Moneybird-projecten per medewerker (laatste 4w)
    const mbRows = [];
    for (const e of employees) {
      const summary = moneybirdSummaryForEmployee(e.id);
      for (const r of summary) {
        mbRows.push({
          'Medewerker': e.name,
          'Moneybird-project': r.name,
          'Status': r.tracked ? 'gekoppeld in app' : 'niet gekoppeld',
          'Uren (4 weken)': Math.round(r.hours * 10) / 10,
        });
      }
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mbRows), 'Moneybird 4w');

    XLSX.writeFile(wb, `planning-${new Date().toISOString().slice(0,10)}.xlsx`);
    toast('Excel gedownload', 'success');
  };

  await loadAllData();
</script>
</body></html>
