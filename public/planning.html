<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Planning — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <div class="page-header">
    <h1>Planning</h1>
    <div style="display:flex; gap:.5rem">
      <button class="btn btn-ghost" id="exportBtn">⬇ Export Excel</button>
    </div>
  </div>
  <p class="subtle">Per medewerker: toegewezen projecten (In progress / On hold / Future), vakantie, weekoverzicht en geschatte einddatum. On hold-projecten tellen niet mee voor resterende uren of einddatum. Inclusief Nederlandse feestdagen.</p>

  <div class="card-static" style="margin-bottom:1rem; padding:.75rem 1rem">
    <label style="display:flex; flex-direction:row; align-items:center; gap:.75rem; margin:0; font-weight:500">
      Filter op medewerker:
      <select id="empFilter" style="width:auto; min-width:240px">
        <option value="all">Alle medewerkers</option>
      </select>
      <span class="subtle" id="filterCount"></span>
    </label>
  </div>

  <div id="content"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, apiSend, renderTopbar, toast, escapeHtml, statusLabel, isDutchHoliday, holidaysBetween } from '/app.js';
  const me = await renderTopbar('/planning.html');

  const PLANNING_STATUSES = new Set(['in_progress', 'on_hold', 'future', 'recurring']);
  const ACTIVE_STATUSES = new Set(['in_progress', 'future', 'recurring']);
  const WEEKS_BACK = 4;

  function todayIso() { const d = new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
  function isoToDate(iso) { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
  function dateToIso(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function fmtDate(iso) { if (!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`; }
  function fmtDateShort(iso) {
    if (!iso) return '';
    const months = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
    const [y, m, d] = iso.split('-');
    return `${Number(d)} ${months[Number(m)-1]}`;
  }
  function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }
  function isOnVacation(iso, periods) { return (periods || []).some((p) => p.start <= iso && iso <= p.end); }
  function isUnavailable(d, vacationPeriods) {
    const iso = dateToIso(d);
    return isWeekend(d) || isOnVacation(iso, vacationPeriods) || isDutchHoliday(iso);
  }
  function mondayOf(date) {
    const d = new Date(date); d.setHours(0, 0, 0, 0);
    const dow = d.getDay();
    const diff = dow === 0 ? -6 : 1 - dow;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function vacationDaysInRange(periods, startIso, endIso) {
    if (!periods || periods.length === 0) return 0;
    let count = 0;
    for (const p of periods) {
      const s = p.start > startIso ? p.start : startIso;
      const e = p.end < endIso ? p.end : endIso;
      if (s > e) continue;
      let d = isoToDate(s); const end = isoToDate(e);
      while (d <= end) {
        if (!isWeekend(d) && !isDutchHoliday(dateToIso(d))) count++;
        d.setDate(d.getDate() + 1);
      }
    }
    return count;
  }
  function estimateCompletionDate(remainingHours, capacityPerWeek, periods) {
    if (!capacityPerWeek || capacityPerWeek <= 0) return null;
    const dailyHours = capacityPerWeek / 5;
    const workDaysNeeded = Math.ceil(remainingHours / dailyHours);
    if (workDaysNeeded === 0) return new Date();
    let d = new Date(); d.setHours(0, 0, 0, 0);
    let worked = 0; let safety = 365 * 5;
    while (worked < workDaysNeeded && safety-- > 0) {
      if (!isUnavailable(d, periods)) {
        worked++;
        if (worked >= workDaysNeeded) return new Date(d);
      }
      d.setDate(d.getDate() + 1);
    }
    return null;
  }

  function modulesCell(modules) {
    if (!modules || modules.length === 0) return '<span class="subtle">—</span>';
    if (modules.length === 1) {
      return `<span class="badge badge-blue">${escapeHtml(modules[0])}</span>`;
    }
    const list = modules.map(escapeHtml).join(', ');
    return `<span class="badge badge-blue" title="${list}">PowerSuite</span>`;
  }

  let projects = [], capacities = {}, vacationsByEmp = {}, overigByEmp = {};
  let dashboardEmps = new Set();

  async function loadAllData() {
    document.getElementById('content').innerHTML = '<p class="subtle">Laden…</p>';

    const [projResp, settingsResp] = await Promise.all([
      apiGet('/api/projects?planning_view=1'),
      apiGet('/api/admin/settings').catch(() => ({ settings: { employee_capacities: {}, employee_vacations: {}, dashboard_planning_employees: [] } })),
    ]);

    projects = projResp.projects;
    capacities = settingsResp.settings.employee_capacities || {};
    vacationsByEmp = settingsResp.settings.employee_vacations || {};
    overigByEmp = settingsResp.settings.employee_overig || {};
    dashboardEmps = new Set(settingsResp.settings.dashboard_planning_employees || []);

    rebuildEmployees();
    render();
  }

  let employees = [];
  const isAdmin = me?.role === 'admin';
  const STORAGE_KEY = 'pm_planning_emp_filter';

  function rebuildEmployees() {
    const byEmp = new Map();
    for (const p of projects) {
      if (!PLANNING_STATUSES.has(p.status)) continue;
      for (const t of (p.team || [])) {
        const key = t.moneybird_user_id;
        if (!byEmp.has(key)) {
          byEmp.set(key, { id: key, name: t.name, rows: [], totalOwn: 0, totalRemaining: 0, newCount: 0 });
        }
        const rec = byEmp.get(key);
        const stat = (p.team_stats || []).find((s) => s.moneybird_user_id === key);
        const ownHours = stat ? Number(stat.hours) || 0 : 0;
        const remaining = Math.max(0, (Number(p.available_hours) || 0) - (Number(p.hours_used) || 0));
        rec.rows.push({ project: p, ownHours, remaining });
        rec.totalOwn += ownHours;
        if (ACTIVE_STATUSES.has(p.status)) rec.totalRemaining += remaining;
        if (p.status === 'future') rec.newCount += 1;
      }
    }
    employees = Array.from(byEmp.values()).sort((a, b) => b.totalRemaining - a.totalRemaining);

    const empFilter = document.getElementById('empFilter');
    const cur = empFilter.value || sessionStorage.getItem(STORAGE_KEY) || 'all';
    empFilter.innerHTML = '<option value="all">Alle medewerkers</option>' +
      employees.map((e) => `<option value="${escapeHtml(e.id)}">${escapeHtml(e.name)}</option>`).join('');
    empFilter.value = cur;
  }

  function buildWeeklyForEmployee(empId) {
    const today = new Date(); today.setHours(0,0,0,0);
    const thisMonday = mondayOf(today);
    const weekStarts = [];
    for (let i = WEEKS_BACK - 1; i >= 0; i--) {
      const d = new Date(thisMonday);
      d.setDate(d.getDate() - 7 * i);
      weekStarts.push(dateToIso(d));
    }
    const weekMap = new Map(weekStarts.map((w) => [w, { perTracked: new Map() }]));

    for (const p of projects) {
      for (const e of (p.time_entries || [])) {
        if (e.user_moneybird_id !== empId || !e.started_at) continue;
        const monday = dateToIso(mondayOf(new Date(String(e.started_at).slice(0,10))));
        if (!weekMap.has(monday)) continue;
        const cur = weekMap.get(monday).perTracked;
        cur.set(p.id, (cur.get(p.id) || 0) + (Number(e.hours) || 0));
      }
    }

    return weekStarts.map((w) => {
      const wd = weekMap.get(w);
      return {
        weekStart: w,
        perProject: Array.from(wd.perTracked.entries())
          .map(([pid, hours]) => {
            const pr = projects.find((x) => x.id === pid);
            return { project_id: pid, project_name: pr ? pr.name : 'Onbekend', hours };
          })
          .sort((a, b) => b.hours - a.hours),
        total: Array.from(wd.perTracked.values()).reduce((a, h) => a + h, 0),
      };
    });
  }

  async function toggleDashboardEmp(empId, on) {
    const next = new Set(dashboardEmps);
    if (on) next.add(empId); else next.delete(empId);
    try {
      const r = await apiSend('/api/admin/settings', 'POST', { dashboard_planning_employees: Array.from(next) });
      dashboardEmps = new Set(r.settings.dashboard_planning_employees || []);
      toast(on ? 'Toegevoegd aan dashboard-alert' : 'Verwijderd uit dashboard-alert', 'success');
    } catch (err) { toast(err.message, 'error'); }
  }

  function render() {
    const empFilter = document.getElementById('empFilter');
    const value = empFilter.value;
    sessionStorage.setItem(STORAGE_KEY, value);
    const shown = value === 'all' ? employees : employees.filter((e) => e.id === value);

    document.getElementById('filterCount').textContent =
      `${shown.length} van ${employees.length} medewerker${employees.length === 1 ? '' : 's'}`;

    const c = document.getElementById('content');
    if (employees.length === 0) {
      c.innerHTML = `<p class="subtle">Geen actieve medewerkers met toegewezen projecten in status "In progress", "Future" of "On hold".</p>`;
      return;
    }
    if (shown.length === 0) {
      c.innerHTML = `<p class="subtle">Geen medewerkers gevonden voor deze filter.</p>`;
      return;
    }

    const today = todayIso();
    c.innerHTML = shown.map((e) => {
      const order = { in_progress: 0, recurring: 1, future: 2, on_hold: 3 };
      const rows = [...e.rows].sort((a, b) => (order[a.project.status] ?? 9) - (order[b.project.status] ?? 9));
      const cap = Number(capacities[e.id]) || 0;
      const periods = vacationsByEmp[e.id] || [];
      const upcoming = periods.filter((p) => p.end >= today);
      const detailHref = `/medewerker.html?id=${encodeURIComponent(e.id)}&name=${encodeURIComponent(e.name)}`;

      let estimateHtml = '<span class="subtle">capaciteit niet ingesteld</span>';
      if (cap > 0 && e.totalRemaining > 0) {
        const completion = estimateCompletionDate(e.totalRemaining, cap, upcoming);
        const baseWeeks = (e.totalRemaining / cap).toFixed(1);
        if (completion) {
          const completionIso = dateToIso(completion);
          const vacationDays = vacationDaysInRange(upcoming, today, completionIso);
          const holidays = holidaysBetween(today, completionIso);
          const extras = [];
          if (vacationDays > 0) extras.push(`${vacationDays} ${vacationDays === 1 ? 'vakantiedag' : 'vakantiedagen'}`);
          if (holidays.length > 0) extras.push(`${holidays.length} ${holidays.length === 1 ? 'feestdag' : 'feestdagen'}`);
          estimateHtml = `${baseWeeks} weken werk · verwacht klaar <strong>${fmtDate(completionIso)}</strong>${extras.length ? ' (incl. ' + extras.join(' + ') + ')' : ''}`;
        } else { estimateHtml = `${baseWeeks} weken werk`; }
      } else if (e.totalRemaining === 0) {
        estimateHtml = '<span class="subtle">niets meer te doen</span>';
      }

      // Komende 4 maandagen (vanaf deze week)
      const todayDate = new Date(); todayDate.setHours(0,0,0,0);
      const thisMon = mondayOf(todayDate);
      const futureWeeks = [];
      for (let i = 0; i < 4; i++) {
        const d = new Date(thisMon); d.setDate(d.getDate() + i * 7);
        futureWeeks.push(dateToIso(d));
      }

      const weeks = buildWeeklyForEmployee(e.id);
      const weeklyRows = weeks.map((w) => {
        const dist = w.perProject.length === 0
          ? '<span class="subtle">geen uren</span>'
          : w.perProject.map((pp) => `<span class="badge badge-gray" style="margin-right:.25rem; display:inline-block; margin-bottom:.2rem">${escapeHtml(pp.project_name)}: ${pp.hours.toFixed(1)}u</span>`).join('');
        const capCmp = cap > 0
          ? `<span class="badge ${w.total >= cap ? 'badge-green' : w.total >= cap * 0.6 ? 'badge-orange' : 'badge-red'}">${w.total.toFixed(1)} / ${cap}u</span>`
          : '<span class="subtle">—</span>';
        return `
          <tr>
            <td>${fmtDateShort(w.weekStart)}</td>
            <td>${dist}</td>
            <td><strong>${w.total.toFixed(1)}u</strong></td>
            <td>${capCmp}</td>
          </tr>`;
      }).join('');

      return `
        <div class="card-static" style="margin-bottom:1.25rem" data-emp-id="${e.id}">
          <div class="card-header" style="margin-bottom:.75rem">
            <div>
              <h2 style="margin:0">${escapeHtml(e.name)}</h2>
              <a href="${detailHref}" style="font-size:.85rem">→ Uren laatste 4 weken</a>
            </div>
            <div class="subtle" style="text-align:right">
              <div>Werkt aan <strong>${e.rows.length}</strong> ${e.rows.length === 1 ? 'project' : 'projecten'}</div>
              <div><strong>${e.totalRemaining.toFixed(1)}</strong> uur budget resterend</div>
              <div>Capaciteit: <strong>${cap > 0 ? cap + ' uur/week' : '—'}</strong></div>
              <div>${estimateHtml}</div>
              ${e.newCount > 0 ? `<div><span class="badge status-future">${e.newCount} nieuwe ${e.newCount === 1 ? 'toewijzing' : 'toewijzingen'}</span></div>` : ''}
            </div>
          </div>

          ${(() => {
            // ─ Pre-compute vakantie/feestdag-uren per week + project-allocatie sommen per week
            const firstName = (e.name || '').trim().split(/\s+/)[0] || e.name;
            const hoursPerDay = cap > 0 ? cap / 5 : 8;
            const vacInfoPerWeek = new Map();
            for (const w of futureWeeks) {
              const [y, m, d] = w.split('-').map(Number);
              const wStart = new Date(y, m - 1, d);
              const items = [];
              for (let i = 0; i < 5; i++) {
                const dd = new Date(wStart); dd.setDate(wStart.getDate() + i);
                const iso = dateToIso(dd);
                const isHoliday = isDutchHoliday(iso);
                const isVac = periods.some((p) => p.start <= iso && iso <= p.end);
                if (isHoliday) items.push({ iso, kind: 'holiday' });
                else if (isVac) items.push({ iso, kind: 'vacation' });
              }
              vacInfoPerWeek.set(w, items);
            }
            const projectAllocSum = new Map(futureWeeks.map((w) => [w, 0]));
            for (const row of rows) {
              const p = row.project;
              for (const a of (p.weekly_allocations || [])) {
                if (a.moneybird_user_id !== e.id) continue;
                if (projectAllocSum.has(a.week_start)) {
                  projectAllocSum.set(a.week_start, projectAllocSum.get(a.week_start) + (Number(a.hours) || 0));
                }
              }
            }
            const overigData = overigByEmp[e.id] || {};
            const totalPerWeek = new Map(futureWeeks.map((w) => {
              const vacHrs = vacInfoPerWeek.get(w).length * hoursPerDay;
              const overigHrs = Number((overigData[w] || {}).hours) || 0;
              return [w, projectAllocSum.get(w) + vacHrs + overigHrs];
            }));
            const anyOver = cap > 0 && futureWeeks.some((w) => totalPerWeek.get(w) > cap + 0.01);

            const SEP = 'border-left:2px solid #cbd5e1';
            const thisMonIso = dateToIso(mondayOf(new Date()));

            const rowsHtml = rows.map((row) => {
              const p = row.project;
              const isOverbudget = row.remaining === 0 && !p.is_hourly_billing;
              const rowStyle = isOverbudget ? ' style="background:rgba(239,68,68,.10)"' : '';
              const empAllocs = (p.weekly_allocations || []).filter((a) => a.moneybird_user_id === e.id);
              const allocByWeek = new Map(empAllocs.map((a) => [a.week_start, Number(a.hours) || 0]));
              // Ingepland = sum of all upcoming allocations for this employee (this week and beyond)
              const ingepland = empAllocs
                .filter((a) => a.week_start >= thisMonIso)
                .reduce((s, a) => s + (Number(a.hours) || 0), 0);
              const ingeplandOver = !p.is_hourly_billing && row.remaining > 0 && ingepland > row.remaining + 0.01;
              const ingeplandCell = p.is_hourly_billing
                ? `<td><span class="subtle">—</span></td>`
                : `<td style="${ingeplandOver ? 'color:#b45309;font-weight:600' : ''}">${ingepland > 0 ? ingepland.toFixed(1) + ' u' : '<span class="subtle">—</span>'}</td>`;
              const allocCells = futureWeeks.map((w, i) => {
                const h = allocByWeek.get(w) || 0;
                return `<td style="${i === 0 ? SEP + '; ' : ''}padding:6px 3px"><input type="number" min="0" step="0.5" data-alloc="${encodeURIComponent(p.id)}|${e.id}|${w}" value="${h > 0 ? h : ''}" placeholder="0" style="width:64px"></td>`;
              }).join('');
              return `
                <tr${rowStyle}>
                  <td><a href="/project.html?id=${encodeURIComponent(p.id)}"><strong>${escapeHtml(p.name)}</strong></a>${p.is_poc ? ' <span class="badge" style="background:rgba(139,92,246,.15);color:#6d28d9">POC</span>' : ''}${p.is_hourly_billing ? ' <span class="badge" style="background:rgba(16,185,129,.15);color:#047857">U/F</span>' : ''}</td>
                  <td>${row.ownHours.toFixed(1)} u</td>
                  <td>${p.is_hourly_billing ? '<span class="subtle">∞</span>' : row.remaining.toFixed(1) + ' u'}</td>
                  <td>${p.is_hourly_billing ? '<span class="subtle">—</span>' : (Number(p.available_hours) || 0).toFixed(1) + ' u'}</td>
                  ${ingeplandCell}
                  ${allocCells}
                </tr>`;
            }).join('');

            const vacCells = futureWeeks.map((w, i) => {
              const items = vacInfoPerWeek.get(w);
              const sep = i === 0 ? `style="${SEP}; padding:6px 3px"` : 'style="padding:6px 3px"';
              if (items.length === 0) return `<td ${sep}><span class="subtle">—</span></td>`;
              const hrs = items.length * hoursPerDay;
              const tip = items.map((it) => `${fmtDate(it.iso)}${it.kind === 'holiday' ? ' (feestdag)' : ''}`).join(', ');
              return `<td ${sep} title="${tip}"><span class="badge badge-orange">${hrs.toFixed(1)} u</span></td>`;
            }).join('');

            const totalCells = futureWeeks.map((w, i) => {
              const planned = totalPerWeek.get(w);
              const over = cap > 0 && planned > cap + 0.01;
              const base = i === 0 ? SEP + '; ' : '';
              const cellStyle = base + 'padding:6px 3px' + (over ? '; color:#b91c1c; background:rgba(239,68,68,.12)' : '');
              if (cap <= 0) return `<td style="${cellStyle}"><strong>${planned.toFixed(1)} u</strong></td>`;
              return `<td style="${cellStyle}"><strong>${planned.toFixed(1)} / ${cap} u</strong></td>`;
            }).join('');

            return `
              <h4 style="margin-top:1rem">Toegewezen projecten (In progress / Future / On hold / Recurring)</h4>
              <p class="subtle" style="margin:0 0 .5rem; font-size:.85rem">De vier rechterkolommen tonen de uren-toewijzing per week (komende 4 weken vanaf maandag). Klik in een veld om aan te passen — wordt automatisch opgeslagen. De vakantie-rij wordt automatisch gevuld op basis van geplande vakantie en NL-feestdagen en kan niet worden bewerkt.</p>
              <table class="table" style="margin:0">
                <thead><tr>
                  <th>Project</th>
                  <th>Uren door ${escapeHtml(firstName)}</th><th>Resterend</th><th>Totaal</th><th>Ingepland</th>
                  ${futureWeeks.map((w, i) => `<th style="${i === 0 ? SEP + '; ' : ''}padding:8px 3px" title="Inplanning week van ${fmtDate(w)}">${fmtDateShort(w)}</th>`).join('')}
                </tr></thead>
                <tbody>
                  ${rowsHtml}
                  <tr style="background:rgba(245,158,11,.06)">
                    <td><strong>Vakantie</strong> <span class="subtle" style="font-size:.8rem">(automatisch)</span></td>
                    <td><span class="subtle">—</span></td>
                    <td><span class="subtle">—</span></td>
                    <td><span class="subtle">—</span></td>
                    <td><span class="subtle">—</span></td>
                    ${vacCells}
                  </tr>
                  <tr style="background:rgba(99,102,241,.06)">
                    <td><strong>Overig</strong> <span class="subtle" style="font-size:.8rem">(losse taakjes)</span></td>
                    <td><span class="subtle">—</span></td>
                    <td><span class="subtle">—</span></td>
                    <td><span class="subtle">—</span></td>
                    <td><span class="subtle">—</span></td>
                    ${futureWeeks.map((w, i) => {
                      const entry = overigData[w] || {};
                      const h = entry.hours > 0 ? entry.hours : '';
                      const note = entry.note || '';
                      const sep = i === 0 ? SEP + '; ' : '';
                      return `<td style="${sep}padding:6px 3px; min-width:110px">
                        <input type="number" min="0" step="0.5" data-overig-hours="${e.id}|${w}" value="${h}" placeholder="0" style="width:54px; margin-bottom:.2rem">
                        <input type="text" data-overig-note="${e.id}|${w}" value="${escapeHtml(note)}" placeholder="notitie…" style="width:100%; font-size:.75rem; padding:.2rem .35rem">
                      </td>`;
                    }).join('')}
                  </tr>
                  <tr style="background:var(--bg-soft)">
                    <td><strong>Totaal per week</strong></td>
                    <td colspan="4"><span class="subtle">—</span></td>
                    ${totalCells}
                  </tr>
                </tbody>
              </table>
              ${anyOver ? `<p style="color:#b91c1c; font-weight:600; margin:.5rem 0 0; font-size:.85rem">⚠ In een of meer weken is meer ingepland dan de capaciteit van ${cap} u/wk toelaat. Pas de inplanning aan of verhoog de capaciteit.</p>` : ''}`;
          })()}

          <h4 style="margin-top:1rem">Wekelijkse breakdown (laatste ${WEEKS_BACK} weken)</h4>
          <table class="table" style="margin:0">
            <thead><tr><th>Week (ma)</th><th>Projecten</th><th>Totaal</th><th>vs. capaciteit</th></tr></thead>
            <tbody>${weeklyRows}</tbody>
          </table>

          <h4 style="margin-top:1.25rem">Geplande vakantie</h4>
          ${(() => {
            const vacRows = periods.map((p, i) => {
              if (p.end < today) return '';
              return `<tr>
                <td>${fmtDate(p.start)}</td>
                <td>${fmtDate(p.end)}</td>
                <td>${p.label ? escapeHtml(p.label) : '<span class="subtle">—</span>'}</td>
                ${isAdmin ? `<td style="text-align:right"><a href="#" data-remove-vac="${e.id}|${i}" style="color:#b91c1c; font-size:.85rem; text-decoration:none">Verwijderen</a></td>` : ''}
              </tr>`;
            }).filter(Boolean).join('');
            const vacTable = vacRows
              ? `<table class="table" style="margin:0 0 .75rem">
                  <thead><tr><th>Van</th><th>Tot</th><th>Label</th>${isAdmin ? '<th></th>' : ''}</tr></thead>
                  <tbody>${vacRows}</tbody>
                </table>`
              : `<p class="subtle" style="margin:0 0 .75rem">Geen geplande vakantie.</p>`;
            const addForm = isAdmin ? `
              <div style="display:flex; flex-wrap:wrap; gap:.5rem; align-items:flex-end">
                <label style="margin:0; flex:0 0 auto"><span class="subtle" style="font-size:.75rem">Van</span><input type="date" data-vac-start="${e.id}" style="width:auto"></label>
                <label style="margin:0; flex:0 0 auto"><span class="subtle" style="font-size:.75rem">Tot</span><input type="date" data-vac-end="${e.id}" style="width:auto"></label>
                <label style="margin:0; flex:1 1 200px"><span class="subtle" style="font-size:.75rem">Label (optioneel)</span><input type="text" data-vac-label="${e.id}" placeholder="bv. zomervakantie"></label>
                <button class="btn btn-ghost" type="button" data-add-vac="${e.id}">+ Vakantie toevoegen</button>
              </div>` : '';
            return vacTable + addForm;
          })()}
        </div>`;
    }).join('');

    for (const inp of c.querySelectorAll('input[data-alloc]')) {
      inp.onchange = async () => {
        const [projectIdRaw, userId, week] = inp.dataset.alloc.split('|');
        const projectId = decodeURIComponent(projectIdRaw);
        const project = projects.find((x) => x.id === projectId);
        if (!project) return;
        const raw = inp.value.trim();
        const hours = raw === '' ? 0 : Number(raw);
        if (!Number.isFinite(hours) || hours < 0) { toast('Ongeldig aantal uren', 'error'); return; }
        const cur = Array.isArray(project.weekly_allocations) ? [...project.weekly_allocations] : [];
        const idx = cur.findIndex((a) => a.moneybird_user_id === userId && a.week_start === week);
        if (hours > 0) {
          if (idx >= 0) cur[idx] = { moneybird_user_id: userId, week_start: week, hours };
          else cur.push({ moneybird_user_id: userId, week_start: week, hours });
        } else if (idx >= 0) {
          cur.splice(idx, 1);
        }
        try {
          inp.disabled = true;
          await apiSend(`/api/projects/${encodeURIComponent(projectId)}`, 'PATCH', { weekly_allocations: cur });
          project.weekly_allocations = cur;
          toast('Inplanning opgeslagen', 'success');
        } catch (err) {
          toast(`Opslaan mislukt: ${err.message}`, 'error');
        } finally {
          inp.disabled = false;
        }
      };
    }

    for (const btn of c.querySelectorAll('button[data-add-vac]')) {
      btn.onclick = async () => {
        const empId = btn.dataset.addVac;
        const start = document.querySelector(`input[data-vac-start="${empId}"]`).value;
        const end = document.querySelector(`input[data-vac-end="${empId}"]`).value;
        const label = document.querySelector(`input[data-vac-label="${empId}"]`).value.trim();
        if (!start || !end) { toast('Vul een start- en einddatum in', 'error'); return; }
        if (start > end) { toast('Einddatum moet na startdatum liggen', 'error'); return; }
        await saveVacations(empId, [...(vacationsByEmp[empId] || []), { start, end, label }]);
      };
    }
    for (const link of c.querySelectorAll('a[data-remove-vac]')) {
      link.onclick = async (ev) => {
        ev.preventDefault();
        const [empId, idx] = link.dataset.removeVac.split('|');
        const cur = vacationsByEmp[empId] || [];
        await saveVacations(empId, cur.filter((_, i) => i !== Number(idx)));
      };
    }

    async function saveOverig(empId, week) {
      const hoursInput = c.querySelector(`input[data-overig-hours="${empId}|${week}"]`);
      const noteInput = c.querySelector(`input[data-overig-note="${empId}|${week}"]`);
      const hours = hoursInput ? (hoursInput.value.trim() === '' ? 0 : Number(hoursInput.value)) : 0;
      const note = noteInput ? noteInput.value.trim() : '';
      if (!Number.isFinite(hours) || hours < 0) { toast('Ongeldig aantal uren', 'error'); return; }
      const empData = { ...(overigByEmp[empId] || {}) };
      if (hours > 0 || note) {
        empData[week] = { hours, note };
      } else {
        delete empData[week];
      }
      const next = { ...overigByEmp, [empId]: empData };
      if (!Object.keys(empData).length) delete next[empId];
      try {
        const r = await apiSend('/api/admin/settings', 'POST', { employee_overig: next });
        Object.assign(overigByEmp, r.settings.employee_overig || {});
        for (const k of Object.keys(overigByEmp)) { if (!(k in (r.settings.employee_overig || {}))) delete overigByEmp[k]; }
        toast('Overig opgeslagen', 'success');
        render();
      } catch (err) { toast(`Opslaan mislukt: ${err.message}`, 'error'); }
    }

    for (const inp of c.querySelectorAll('input[data-overig-hours], input[data-overig-note]')) {
      const isHours = inp.hasAttribute('data-overig-hours');
      const raw = isHours ? inp.dataset.overigHours : inp.dataset.overigNote;
      const [empId, week] = raw.split('|');
      inp.onchange = () => saveOverig(empId, week);
    }
  }

  async function saveVacations(empId, list) {
    const next = { ...vacationsByEmp, [empId]: list };
    if (list.length === 0) delete next[empId];
    try {
      await apiSend('/api/admin/settings', 'POST', { employee_vacations: next });
      Object.assign(vacationsByEmp, next);
      for (const k of Object.keys(vacationsByEmp)) { if (!(k in next)) delete vacationsByEmp[k]; }
      toast('Vakantie opgeslagen', 'success');
      render();
    } catch (err) { toast(err.message, 'error'); }
  }

  document.getElementById('empFilter').addEventListener('change', render);

  document.getElementById('exportBtn').onclick = () => {
    if (typeof XLSX === 'undefined') { toast('Excel-library niet geladen', 'error'); return; }
    const wb = XLSX.utils.book_new();
    const sumRows = employees.map((e) => {
      const cap = Number(capacities[e.id]) || 0;
      const periods = vacationsByEmp[e.id] || [];
      const upcoming = periods.filter((p) => p.end >= todayIso());
      let estCompletion = '';
      if (cap > 0 && e.totalRemaining > 0) {
        const cd = estimateCompletionDate(e.totalRemaining, cap, upcoming);
        if (cd) estCompletion = dateToIso(cd);
      }
      return {
        'Medewerker': e.name, 'Aantal projecten': e.rows.length,
        'Uren resterend totaal': Math.round(e.totalRemaining * 10) / 10,
        'Capaciteit (u/wk)': cap || '', 'Verwacht klaar': estCompletion,
        'Geplande vakantie': upcoming.map((p) => `${p.start} t/m ${p.end}${p.label ? ' (' + p.label + ')' : ''}`).join('; '),
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sumRows), 'Per medewerker');

    const assignRows = [];
    for (const e of employees) {
      for (const r of e.rows) {
        const p = r.project;
        assignRows.push({
          'Medewerker': e.name, 'Project': p.name,
          'Modules': (p.modules || []).join(', '),
          'Status': statusLabel(p.status), 'POC': p.is_poc ? 'Ja' : '',
          'Deadline': p.deadline || '',
          'Uren door persoon': Math.round(r.ownHours * 10) / 10,
          'Resterend op project': Math.round(r.remaining * 10) / 10,
          'Totaal beschikbaar': Number(p.available_hours) || 0,
        });
      }
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assignRows), 'Toewijzingen');

    const weeklyRows = [];
    for (const e of employees) {
      const weeks = buildWeeklyForEmployee(e.id);
      for (const w of weeks) {
        for (const pp of w.perProject) {
          weeklyRows.push({ 'Medewerker': e.name, 'Week (ma)': w.weekStart, 'Project': pp.project_name, 'Uren': Math.round(pp.hours * 10) / 10 });
        }
      }
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(weeklyRows), 'Weekly');

    XLSX.writeFile(wb, `planning-${new Date().toISOString().slice(0,10)}.xlsx`);
    toast('Excel gedownload', 'success');
  };

  await loadAllData();
</script>
</body></html>
