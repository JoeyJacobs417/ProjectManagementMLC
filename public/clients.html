<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Klanten — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <div class="page-header">
    <h1>Klanten</h1>
    <span class="subtle" id="countLabel"></span>
  </div>
  <p class="subtle">Overzicht van klanten met hun projecten en totale urenstatus. Admin-gebruikers kunnen klanten toevoegen, hernoemen en verwijderen.</p>

  <div class="card-static" style="margin-bottom:1rem; padding:.75rem 1rem">
    <label style="display:flex; flex-direction:row; align-items:center; gap:.5rem; margin:0; font-weight:500">
      🔍 <input type="search" id="searchInput" placeholder="Zoek klant of contactpersoon" style="flex:1">
    </label>
  </div>

  <div id="adminPanel" class="hidden">
    <div class="card-static" style="margin-bottom:1rem">
      <h3>Klanten beheren</h3>
      <p class="subtle" style="margin-top:-.25rem">Wijzig naam en contactpersonen direct hieronder. Klik op "Klanten opslaan" om je wijzigingen door te voeren.</p>
      <div id="clientsEdit"></div>
      <div style="display:flex; gap:.5rem; margin-top:1rem">
        <button class="btn btn-ghost" type="button" id="addClient">+ Klant toevoegen</button>
        <button class="btn btn-primary" type="button" id="saveClients">Klanten opslaan</button>
      </div>
    </div>
  </div>

  <h2>Overzicht</h2>
  <div id="content"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, apiSend, renderTopbar, toast, escapeHtml, percentageBadgeClass, statusLabel } from '/app.js';
  const me = await renderTopbar('/clients.html');

  const [{ projects }, settingsResp] = await Promise.all([
    apiGet('/api/projects'),
    apiGet('/api/admin/settings'),
  ]);
  const isAdmin = me?.role === 'admin';
  let clients = settingsResp.settings.clients || [];

  // ── Beheer (admin only) ─────────────────────────────────────────
  if (isAdmin) {
    document.getElementById('adminPanel').classList.remove('hidden');
    let workingClients = JSON.parse(JSON.stringify(clients));

    function renderEdit() {
      const el = document.getElementById('clientsEdit');
      if (workingClients.length === 0) {
        el.innerHTML = '<p class="subtle">Nog geen klanten. Klik op "+ Klant toevoegen".</p>';
        return;
      }
      el.innerHTML = workingClients.map((c, i) => {
        const contactsRows = (c.contacts && c.contacts.length ? c.contacts : [{ name: '', email: '' }]).map((cc, j) => `
          <tr>
            <td><input type="text" data-cli="${i}" data-c-idx="${j}" data-c-field="name" value="${escapeHtml(cc.name || '')}" placeholder="Naam"></td>
            <td><input type="email" data-cli="${i}" data-c-idx="${j}" data-c-field="email" value="${escapeHtml(cc.email || '')}" placeholder="email@bedrijf.nl"></td>
            <td><button class="btn btn-ghost" type="button" data-remove-contact="${i}|${j}">Verwijder</button></td>
          </tr>`).join('');
        return `
          <div style="border-top:1px solid var(--border); padding:1rem 0">
            <div class="form-row" style="grid-template-columns:1fr auto">
              <label>
                <span class="lbl">Bedrijfsnaam</span>
                <input type="text" data-cli="${i}" data-field="name" value="${escapeHtml(c.name || '')}">
              </label>
              <label style="align-self:end">
                <button class="btn btn-ghost" type="button" data-remove-client="${i}">Klant verwijderen</button>
              </label>
            </div>
            <table class="table" style="margin:.5rem 0 0">
              <thead><tr><th>Contactpersoon</th><th>E-mail</th><th></th></tr></thead>
              <tbody>${contactsRows}</tbody>
            </table>
            <button class="btn btn-ghost" type="button" data-add-contact="${i}" style="margin-top:.25rem">+ Contact toevoegen</button>
          </div>`;
      }).join('');

      el.querySelectorAll('input[data-cli][data-field]').forEach((inp) => {
        inp.oninput = () => {
          workingClients[Number(inp.dataset.cli)][inp.dataset.field] = inp.value;
        };
      });
      el.querySelectorAll('input[data-cli][data-c-idx]').forEach((inp) => {
        inp.oninput = () => {
          const i = Number(inp.dataset.cli);
          const j = Number(inp.dataset.cIdx);
          if (!workingClients[i].contacts) workingClients[i].contacts = [];
          if (!workingClients[i].contacts[j]) workingClients[i].contacts[j] = { name: '', email: '' };
          workingClients[i].contacts[j][inp.dataset.cField] = inp.value;
        };
      });
      el.querySelectorAll('button[data-add-contact]').forEach((btn) => {
        btn.onclick = () => {
          const i = Number(btn.dataset.addContact);
          if (!workingClients[i].contacts) workingClients[i].contacts = [];
          workingClients[i].contacts.push({ name: '', email: '' });
          renderEdit();
        };
      });
      el.querySelectorAll('button[data-remove-contact]').forEach((btn) => {
        btn.onclick = () => {
          const [i, j] = btn.dataset.removeContact.split('|').map(Number);
          workingClients[i].contacts.splice(j, 1);
          renderEdit();
        };
      });
      el.querySelectorAll('button[data-remove-client]').forEach((btn) => {
        btn.onclick = () => {
          const i = Number(btn.dataset.removeClient);
          if (!confirm(`"${workingClients[i].name || 'deze klant'}" verwijderen?`)) return;
          workingClients.splice(i, 1);
          renderEdit();
        };
      });
    }
    renderEdit();

    document.getElementById('addClient').onclick = () => {
      workingClients.push({ name: '', contacts: [{ name: '', email: '' }] });
      renderEdit();
    };
    document.getElementById('saveClients').onclick = async () => {
      try {
        const r = await apiSend('/api/admin/settings', 'POST', { clients: workingClients });
        clients = r.settings.clients || [];
        workingClients = JSON.parse(JSON.stringify(clients));
        toast('Klanten opgeslagen', 'success');
        renderEdit();
        renderOverview();
      } catch (err) { toast(err.message, 'error'); }
    };
  }

  // ── Overzicht ────────────────────────────────────────────────────
  const search = document.getElementById('searchInput');
  const STORAGE_KEY = 'pm_clients_query';
  search.value = sessionStorage.getItem(STORAGE_KEY) || '';

  function renderOverview() {
    const q = search.value.trim().toLowerCase();
    sessionStorage.setItem(STORAGE_KEY, q);

    const byClient = new Map();
    for (const c of clients) {
      byClient.set(c.id, { client: c, projects: [], totalAvailable: 0, totalUsed: 0 });
    }
    for (const p of projects) {
      if (!p.client_id || !byClient.has(p.client_id)) continue;
      const rec = byClient.get(p.client_id);
      rec.projects.push(p);
      rec.totalAvailable += Number(p.available_hours) || 0;
      rec.totalUsed += Number(p.hours_used) || 0;
    }
    const list = Array.from(byClient.values()).sort((a, b) => a.client.name.localeCompare(b.client.name));

    const matches = q
      ? list.filter(({ client }) => {
          const hay = [client.name, ...(client.contacts || []).map((c) => `${c.name} ${c.email}`)].join(' ').toLowerCase();
          return q.split(/\s+/).filter(Boolean).every((t) => hay.includes(t));
        })
      : list;

    document.getElementById('countLabel').textContent = `${matches.length} van ${list.length} klanten`;

    const c = document.getElementById('content');
    if (list.length === 0) {
      c.innerHTML = `<p class="subtle">Nog geen klanten.${isAdmin ? ' Gebruik het beheer-paneel hierboven om er een toe te voegen.' : ''}</p>`;
      return;
    }
    if (matches.length === 0) {
      c.innerHTML = '<p class="subtle">Geen klanten gevonden voor deze zoekopdracht.</p>';
      return;
    }
    c.innerHTML = matches.map(({ client, projects, totalAvailable, totalUsed }) => {
      const pct = totalAvailable > 0 ? Math.round((totalUsed / totalAvailable) * 1000) / 10 : 0;
      return `
        <div class="card-static" style="margin-bottom:1rem">
          <div class="card-header">
            <div>
              <h2 style="margin:0">${escapeHtml(client.name)}</h2>
              <p class="subtle" style="margin:.25rem 0">${projects.length} ${projects.length === 1 ? 'project' : 'projecten'}</p>
            </div>
            <div class="subtle" style="text-align:right">
              <div><strong>${totalUsed.toFixed(1)}</strong> / ${totalAvailable.toFixed(1)} uur</div>
              ${totalAvailable > 0 ? `<div><span class="badge ${percentageBadgeClass(pct)}">${pct}%</span></div>` : ''}
            </div>
          </div>

          ${(client.contacts && client.contacts.length) ? `
            <div style="margin-top:.5rem">
              <div class="subtle" style="font-size:.75rem; text-transform:uppercase; letter-spacing:.04em">Contactpersonen</div>
              <ul style="margin:.25rem 0 0; padding-left:1.2rem">
                ${client.contacts.map((cc) => `<li>${escapeHtml(cc.name || '')}${cc.email ? ` — <a href="mailto:${escapeHtml(cc.email)}">${escapeHtml(cc.email)}</a>` : ''}</li>`).join('')}
              </ul>
            </div>` : ''}

          ${projects.length > 0 ? `
            <table class="table" style="margin-top:.75rem">
              <thead><tr><th>Project</th><th>Status</th><th>Uren</th><th>%</th></tr></thead>
              <tbody>
                ${projects.map((p) => `
                  <tr class="clickable" data-id="${encodeURIComponent(p.id)}">
                    <td><strong>${escapeHtml(p.name)}</strong>${p.is_poc ? ' <span class="badge" style="background:rgba(139,92,246,.15);color:#6d28d9">POC</span>' : ''}</td>
                    <td><span class="badge status-${p.status}">${statusLabel(p.status)}</span></td>
                    <td>${p.hours_used.toFixed(1)} / ${(p.available_hours || 0).toFixed(1)} u</td>
                    <td><span class="badge ${percentageBadgeClass(p.percentage_used)}">${p.percentage_used}%</span></td>
                  </tr>`).join('')}
              </tbody>
            </table>` : '<p class="subtle" style="margin-top:.5rem">Geen gekoppelde projecten.</p>'}
        </div>`;
    }).join('');

    for (const tr of c.querySelectorAll('tr.clickable')) {
      tr.onclick = () => location.href = `/project.html?id=${tr.dataset.id}`;
    }
  }

  search.addEventListener('input', renderOverview);
  renderOverview();
</script>
</body></html>
