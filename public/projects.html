<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Projecten — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<style>
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { background: var(--bg-soft); }
  th .sort-arrow { display: inline-block; margin-left: .25rem; opacity: .5; font-size: .75em; }
  th[data-sort].active .sort-arrow { opacity: 1; }
</style>
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <div class="page-header">
    <h1>Projecten</h1>
    <div style="display:flex; gap:.5rem; flex-wrap:wrap">
      <button class="btn btn-ghost" id="syncAllBtn">↻ Synchroniseer alles</button>
      <a class="btn btn-ghost" href="/api/projects?format=xlsx" download>⬇ Export Excel</a>
      <a class="btn btn-primary" href="/new-project.html">+ Nieuw project</a>
    </div>
  </div>
  <p class="subtle" id="syncInfo">Laden…</p>

  <div class="card-static" style="margin-bottom:1rem; padding:.75rem 1rem">
    <div style="display:flex; flex-wrap:wrap; align-items:center; gap:.75rem">
      <label style="display:flex; flex-direction:row; align-items:center; gap:.5rem; margin:0; font-weight:500; flex:1; min-width:240px">
        🔍
        <input type="search" id="searchInput" placeholder="Zoek op project, contact, manager, module, team…" style="flex:1">
      </label>
      <div style="display:flex; flex-direction:row; align-items:center; gap:.5rem; flex-wrap:wrap; margin:0; font-weight:500">
        <span>Status:</span>
        <label style="display:inline-flex; align-items:center; gap:.3rem; font-weight:400"><input type="checkbox" data-status="in_progress" style="width:auto"> In progress</label>
        <label style="display:inline-flex; align-items:center; gap:.3rem; font-weight:400"><input type="checkbox" data-status="on_hold" style="width:auto"> On hold</label>
        <label style="display:inline-flex; align-items:center; gap:.3rem; font-weight:400"><input type="checkbox" data-status="done" style="width:auto"> Done</label>
        <label style="display:inline-flex; align-items:center; gap:.3rem; font-weight:400"><input type="checkbox" data-status="future" style="width:auto"> Future</label>
        <label style="display:inline-flex; align-items:center; gap:.3rem; font-weight:400"><input type="checkbox" data-status="recurring" style="width:auto"> Recurring</label>
      </div>
      <label style="display:flex; flex-direction:row; align-items:center; gap:.4rem; margin:0; font-weight:500">
        <input type="checkbox" id="filterPoc" style="width:auto"> Alleen POC
      </label>
      <span class="subtle" id="filterCount"></span>
    </div>
  </div>

  <div id="content"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, apiSend, renderTopbar, toast, escapeHtml, percentageBadgeClass, statusLabel, fmtDateTime, sentimentDot } from '/app.js';
  await renderTopbar('/projects.html');

  let projects = [];

  function nextScheduledSync() {
    const now = new Date();
    const today = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 7, 0, 0));
    if (today > now) return today;
    const tomorrow = new Date(today);
    tomorrow.setUTCDate(tomorrow.getUTCDate() + 1);
    return tomorrow;
  }

  async function loadAll() {
    const pResp = await apiGet('/api/projects');
    projects = pResp.projects;
    updateSyncInfo();
    render();
  }

  function updateSyncInfo() {
    const withSync = projects.filter((p) => p.last_synced_at).map((p) => p.last_synced_at).sort();
    const latest = withSync.length ? withSync[withSync.length - 1] : null;
    const next = nextScheduledSync();
    const nextStr = next.toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const el = document.getElementById('syncInfo');
    const latestStr = latest
      ? `Laatste sync: <strong>${fmtDateTime(latest)}</strong>`
      : `<span class="subtle">Nog nooit gesynchroniseerd.</span>`;
    el.innerHTML = `${latestStr} · Volgende automatische sync: <strong>${nextStr}</strong>${withSync.length < projects.length ? ` <span class="subtle">(${projects.length - withSync.length} nog nooit gesynced)</span>` : ''}`;
  }

  document.getElementById('syncAllBtn').onclick = async () => {
    const btn = document.getElementById('syncAllBtn');
    btn.disabled = true; btn.textContent = '⏳ Bezig met syncen…';
    toast('Alle projecten worden gesynchroniseerd, dit kan even duren…', 'info');
    try {
      const r = await apiSend('/api/projects/sync-all', 'POST');
      let msg = `${r.totalEntries} entries opgehaald uit ${r.succeeded} projecten${r.failed ? ` (${r.failed} fouten)` : ''}.`;
      if (r.recentMb && r.recentMb.count >= 0) {
        msg += ` Bulk-cache: ${r.recentMb.count} entries vanaf ${r.recentMb.since} (+${r.recentMb.fresh} nieuw).`;
      } else if (r.recentMbError) {
        msg += ` ⚠ Bulk-cache refresh faalde: ${r.recentMbError}`;
      }
      toast(msg, r.recentMbError ? 'error' : 'success');
      await loadAll();
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '↻ Synchroniseer alles';
    }
  };

  const STORAGE_STATUS = 'pm_projects_status_filter';
  const STORAGE_QUERY = 'pm_projects_query';
  const STORAGE_SORT_DIR = 'pm_projects_pct_sort_dir';
  const STORAGE_POC = 'pm_projects_filter_poc';
  const statusCheckboxes = Array.from(document.querySelectorAll('input[data-status]'));
  const search = document.getElementById('searchInput');
  const filterPoc = document.getElementById('filterPoc');
  const savedStatuses = (sessionStorage.getItem(STORAGE_STATUS) || '').split(',').filter(Boolean);
  for (const cb of statusCheckboxes) cb.checked = savedStatuses.includes(cb.dataset.status);
  search.value = sessionStorage.getItem(STORAGE_QUERY) || '';
  filterPoc.checked = sessionStorage.getItem(STORAGE_POC) === '1';
  // 0 = niet sorteren, 1 = oplopend, -1 = aflopend
  let pctSortDir = Number(sessionStorage.getItem(STORAGE_SORT_DIR)) || 0;

  function matchSearch(p, q) {
    if (!q) return true;
    const haystack = [
      p.name, p.description,
      ...(p.modules || []),
      p.manager_name,
      (p.team || []).map((t) => t.name).join(' '),
      (p.contacts || []).map((c) => `${c.name} ${c.email}`).join(' '),
    ].filter(Boolean).join(' ').toLowerCase();
    return q.split(/\s+/).filter(Boolean).every((term) => haystack.includes(term));
  }

  function modulesCell(modules) {
    if (!modules || modules.length === 0) return '<span class="subtle">—</span>';
    if (modules.length === 1) {
      return `<span class="badge badge-blue">${escapeHtml(modules[0])}</span>`;
    }
    const list = modules.map(escapeHtml).join(', ');
    return `<span class="badge badge-blue" title="${list}">PowerSuite</span>`;
  }

  function initialsOf(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function teamCell(team) {
    if (!team || team.length === 0) return '<span class="subtle">—</span>';
    return team.map((t) => `<span class="badge badge-gray" style="margin-right:.2rem" title="${escapeHtml(t.name)}">${escapeHtml(initialsOf(t.name))}</span>`).join('');
  }

  function render() {
    const selectedStatuses = statusCheckboxes.filter((cb) => cb.checked).map((cb) => cb.dataset.status);
    const q = search.value.trim().toLowerCase();
    const onlyPoc = filterPoc.checked;
    sessionStorage.setItem(STORAGE_STATUS, selectedStatuses.join(','));
    sessionStorage.setItem(STORAGE_QUERY, q);
    sessionStorage.setItem(STORAGE_POC, onlyPoc ? '1' : '0');

    const filtered = projects.filter((p) => {
      // Geen status aangevinkt = alle statussen tonen.
      if (selectedStatuses.length > 0 && !selectedStatuses.includes(p.status || 'in_progress')) return false;
      if (onlyPoc && !p.is_poc) return false;
      if (!matchSearch(p, q)) return false;
      return true;
    });

    if (pctSortDir !== 0) {
      filtered.sort((a, b) => {
        // Uurtje-factuurtje projecten hebben geen %, sorteren altijd onderaan.
        if (a.is_hourly_billing && !b.is_hourly_billing) return 1;
        if (!a.is_hourly_billing && b.is_hourly_billing) return -1;
        if (a.is_hourly_billing && b.is_hourly_billing) return 0;
        return pctSortDir * ((Number(a.percentage_used) || 0) - (Number(b.percentage_used) || 0));
      });
    }

    document.getElementById('filterCount').textContent =
      `${filtered.length} van ${projects.length} ${projects.length === 1 ? 'project' : 'projecten'}`;

    const content = document.getElementById('content');
    if (filtered.length === 0) {
      content.innerHTML = '<p class="subtle">Geen projecten gevonden.</p>';
      return;
    }
    const pctArrow = pctSortDir === 0 ? '↕' : (pctSortDir === -1 ? '▼' : '▲');
    content.innerHTML = `
      <table class="table">
        <thead><tr>
          <th>Project</th><th>Status</th><th>Sentiment</th><th>Modules</th>
          <th>PM</th><th>Team</th><th>Uren</th>
          <th data-sort="pct" class="${pctSortDir !== 0 ? 'active' : ''}">% <span class="sort-arrow">${pctArrow}</span></th>
          <th>PDF</th>
        </tr></thead>
        <tbody>
          ${filtered.map((p) => {
            const s = p.status || 'in_progress';
            const pdfCell = p.has_pdf
              ? `<a href="/api/projects/${encodeURIComponent(p.id)}?action=download_pdf" download title="${escapeHtml(p.source_pdf_filename || 'offerte.pdf')}" data-stop>⬇</a>`
              : '<span class="subtle">—</span>';
            return `
              <tr class="clickable" data-id="${encodeURIComponent(p.id)}">
                <td><strong>${escapeHtml(p.name)}</strong>${p.is_poc ? ' <span class="badge" style="background:rgba(139,92,246,.15);color:#6d28d9">POC</span>' : ''}</td>
                <td><span class="badge status-${s}">${s === 'in_progress' ? 'WIP' : statusLabel(s)}</span></td>
                <td style="text-align:center">${sentimentDot(p.sentiment, false)}</td>
                <td>${modulesCell(p.modules)}</td>
                <td>${escapeHtml(p.manager_name || '—')}</td>
                <td>${teamCell(p.team)}</td>
                <td>${p.is_hourly_billing ? `${p.hours_used.toFixed(1)} u <span class="subtle">(uurtje-factuurtje)</span>` : `${p.hours_used.toFixed(1)} / ${(p.available_hours || 0).toFixed(1)} u`}</td>
                <td>${p.is_hourly_billing ? '<span class="subtle">N/A</span>' : `<span class="badge ${percentageBadgeClass(p.percentage_used)}">${p.percentage_used}%</span>`}</td>
                <td style="text-align:center">${pdfCell}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
    content.querySelectorAll('tr.clickable').forEach((tr) => {
      tr.onclick = (ev) => {
        if (ev.target.closest('[data-stop]')) return;
        location.href = `/project.html?id=${tr.dataset.id}`;
      };
    });
    const pctTh = content.querySelector('th[data-sort="pct"]');
    if (pctTh) {
      pctTh.onclick = () => {
        // 0 → -1 (aflopend, hoogste %% eerst) → 1 (oplopend) → 0 (geen sortering)
        pctSortDir = pctSortDir === 0 ? -1 : pctSortDir === -1 ? 1 : 0;
        sessionStorage.setItem(STORAGE_SORT_DIR, String(pctSortDir));
        render();
      };
    }
  }

  statusCheckboxes.forEach((cb) => cb.addEventListener('change', render));
  search.addEventListener('input', render);
  filterPoc.addEventListener('change', render);
  await loadAll();
</script>
</body></html>
