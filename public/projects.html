<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><title>Projecten — Projectmanager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head><body>
<header class="topbar" id="topbar"></header>
<main class="container">
  <div class="page-header">
    <h1>Projecten</h1>
    <a class="btn btn-primary" href="/new-project.html">+ Nieuw project</a>
  </div>
  <div id="content"><p class="subtle">Laden…</p></div>
</main>
<script type="module">
  import { apiGet, renderTopbar, escapeHtml, percentageBadgeClass } from '/app.js';
  await renderTopbar('/projects.html');
  const { projects } = await apiGet('/api/projects');
  const content = document.getElementById('content');
  if (projects.length === 0) {
    content.innerHTML = '<p class="subtle">Geen projecten.</p>';
  } else {
    content.innerHTML = `
      <table class="table">
        <thead><tr>
          <th>Project</th><th>PM</th><th>Beschikbaar</th><th>Verbruikt</th><th>%</th><th>Uurtarief</th>
        </tr></thead>
        <tbody>
          ${projects.map((p) => `
            <tr class="clickable" data-id="${encodeURIComponent(p.id)}">
              <td><strong>${escapeHtml(p.name)}</strong></td>
              <td>${escapeHtml(p.manager_name || '—')}</td>
              <td>${(p.available_hours || 0).toFixed(1)} u</td>
              <td>${p.hours_used.toFixed(1)} u</td>
              <td><span class="badge ${percentageBadgeClass(p.percentage_used)}">${p.percentage_used}%</span></td>
              <td>€ ${(p.hourly_rate || 0).toFixed(2)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
    content.querySelectorAll('tr.clickable').forEach((tr) => {
      tr.onclick = () => location.href = `/project.html?id=${tr.dataset.id}`;
    });
  }
</script>
</body></html>
